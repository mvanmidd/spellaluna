<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellodrum</title>
<style>
/*
 * Theme-free layout for the spelling-game shell: letter tiles, overlays, the add-a-word
 * modal, flying sprites, the tray and the mute button.
 *
 * Themes set the palette by overriding these custom properties, and own everything else
 * (backgrounds, art, celebration choreography).
 */

:root {
  --ink: #f3efe0;          /* body text */
  --ink-dim: rgba(243, 239, 224, 0.6);
  --accent: #ffd166;       /* highlights: done tiles, headings */
  --accent-edge: #f4a93c;
  --accent-ink: #5b3a26;   /* text on top of --accent */
  --overlay-bg: rgba(13, 19, 48, 0.96);
  --panel-bg: rgba(13, 19, 48, 0.97);
  --hairline: rgba(243, 239, 224, 0.3);
  --tile-bg: rgba(255, 255, 255, 0.08);
  --tile-ink: rgba(243, 239, 224, 0.32);   /* letter not yet typed */
  --tile-edge: rgba(243, 239, 224, 0.25);  /* its dashed outline */
  --hint-ink: var(--ink-dim);
  --chrome-ink: var(--ink);                /* the mute button, over the play area */
  --error: #ff6b6b;
  --game-font: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "Trebuchet MS", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--game-font);
  color: var(--ink);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  max-width: 1100px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

/* ---------- word tiles ---------- */

#word-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;
}

#tiles {
  --n: 5;
  --gap: clamp(4px, 1vw, 16px);
  display: flex;
  justify-content: center;
  gap: var(--gap);
}

/* Tiles are as big as they can be while the whole word still fits on one line. */
.tile {
  --tile-w: min(
    clamp(30px, 10vw, 92px),
    calc((min(100vw - 32px, 1100px) - (var(--n) - 1) * var(--gap)) / var(--n))
  );
  width: var(--tile-w);
  height: calc(var(--tile-w) * 1.19);
  font-size: calc(var(--tile-w) * 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: var(--tile-ink);
  background: var(--tile-bg);
  border: 3px dashed var(--tile-edge);
  border-radius: clamp(6px, calc(var(--tile-w) * 0.18), 16px);
}

.tile.done {
  color: var(--accent-ink);
  background: var(--accent);
  border: 3px solid var(--accent-edge);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  animation: tile-pop 0.45s ease-out;
}

@keyframes tile-pop {
  0% { transform: scale(0.6) rotate(-6deg); }
  55% { transform: scale(1.22) rotate(3deg); }
  100% { transform: scale(1) rotate(0); }
}

#hint {
  font-size: clamp(15px, 2.4vw, 21px);
  color: var(--hint-ink);
  letter-spacing: 0.06em;
  min-height: 1.4em;
  text-align: center;
}

/* ---------- collection tray ---------- */

#tray {
  position: fixed;
  left: 14px;
  bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  max-width: 280px;
  align-items: flex-end;
}
#tray svg {
  width: 42px;
  height: 42px;
  animation: tray-drop 0.4s ease-out;
}
@keyframes tray-drop {
  from { transform: translateY(-22px) scale(0.4); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

/* ---------- flying / crawling sprites ---------- */

.sprite {
  position: fixed;
  pointer-events: none;
  z-index: 40;
}
.sprite svg { display: block; }

/* ---------- mute button ---------- */

#mute {
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 60;
  font-size: 22px;
  line-height: 1;
  padding: 8px 10px;
  border-radius: 12px;
  border: 2px solid var(--chrome-hairline, var(--hairline));
  background: var(--chrome-bg, var(--tile-bg));
  color: var(--chrome-ink);
  cursor: pointer;
}

/* ---------- overlays ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--overlay-bg);
  text-align: center;
  padding: 24px;
}
.overlay[hidden] { display: none; }

#start-overlay h1 {
  margin: 0;
  font-size: clamp(40px, 8.5vw, 96px);
  letter-spacing: 0.08em;
  color: var(--accent);
  text-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
}
#start-overlay .subtitle {
  margin: 0;
  font-size: clamp(16px, 2.6vw, 24px);
  color: var(--ink);
  opacity: 0.8;
}
#start-overlay .press {
  margin-top: 18px;
  font-size: clamp(18px, 3vw, 28px);
  color: var(--ink);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

/* ---------- celebration overlay ---------- */

#celebration .scene {
  width: min(92vw, 760px);
  height: auto;
}
#celebration .scene[hidden] { display: none; }

#celebration-caption {
  font-size: clamp(20px, 3.6vw, 38px);
  color: var(--accent);
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  min-height: 1.4em;
}
#celebration-word {
  font-size: clamp(22px, 4.4vw, 54px);
  letter-spacing: 0.2em;
  color: var(--ink);
}

/* every celebration sprite is positioned purely via CSS transforms */
#celebration use, #celebration .cb { transform-box: view-box; }

/* ---------- add-a-word modal ---------- */

#add-word-modal { z-index: 70; }

#add-word-card {
  background: var(--panel-bg);
  border: 2px solid var(--hairline);
  border-radius: 20px;
  padding: 32px 36px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: min(480px, 90vw);
  text-align: center;
}

#add-word-card label {
  font-size: clamp(16px, 2.4vw, 22px);
  color: var(--ink);
}

#add-word-input {
  font-family: inherit;
  font-size: clamp(24px, 5vw, 44px);
  font-weight: bold;
  letter-spacing: 0.12em;
  text-align: center;
  text-transform: uppercase;
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid var(--hairline);
  background: var(--tile-bg);
  color: var(--accent);
  outline: none;
  width: 100%;
}
#add-word-input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.12);
}

#add-word-error {
  font-size: clamp(13px, 1.8vw, 16px);
  color: var(--error);
  min-height: 1.2em;
}

#add-word-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

#add-word-buttons button {
  font-family: inherit;
  font-size: clamp(15px, 2vw, 19px);
  padding: 10px 22px;
  border-radius: 12px;
  border: 2px solid var(--hairline);
  cursor: pointer;
}

#add-word-confirm {
  background: rgba(255, 209, 102, 0.18);
  color: var(--accent);
}
#add-word-confirm:hover { background: rgba(255, 209, 102, 0.3); }

#add-word-cancel {
  background: rgba(255, 255, 255, 0.06);
  color: var(--ink-dim);
}
#add-word-cancel:hover { background: rgba(255, 255, 255, 0.12); }
</style>
<style>
/* Spellodrum — Greg on a small stage, under coloured lights.
   Layout, tiles, overlays and the add-a-word modal live in ../../engine/engine.css. */

:root {
  /* the whole game is dark, so the engine's default (dark) chrome works as-is */
  --ink: #f6eee6;
  --ink-dim: rgba(246, 238, 230, 0.64);
  --accent: #ffcf4a;            /* cymbal gold */
  --accent-edge: #d99a22;
  --accent-ink: #3a2408;
  --overlay-bg: rgba(22, 11, 34, 0.97);
  --panel-bg: rgba(22, 11, 34, 0.98);
  --hairline: rgba(246, 238, 230, 0.28);
  --tile-bg: rgba(255, 207, 74, 0.07);
  --tile-ink: rgba(246, 238, 230, 0.32);
  --tile-edge: rgba(255, 207, 74, 0.3);

  /* how tall the stage is — the dark floor below it starts exactly here */
  --scene-h: min(52vh, 44vw);
}

body {
  background:
    linear-gradient(180deg, #1b0f2e 0%, #2c1440 60%, #3b1a45 100%)
      no-repeat 0 0 / 100% var(--scene-h),
    linear-gradient(180deg, #24150f 0%, #140b12 100%)
      no-repeat 0 var(--scene-h) / 100% 100%;
}

/* ---------- main scene ---------- */

/* Edge to edge. The svg uses "meet", so the whole viewBox always shows and the
   scenery drawn past its edges fills the rest (see the note in index.html). */
#scene {
  display: block;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  height: var(--scene-h);
}

#scene .beam {
  fill: var(--c);
  opacity: 0.16;
  mix-blend-mode: screen;
  animation: beam-sway 5s ease-in-out infinite alternate;
}
#scene .bm1 { transform-origin: 200px 80px; }
#scene .bm2 { transform-origin: 400px 80px; animation-delay: -1.2s; animation-duration: 6s; }
#scene .bm3 { transform-origin: 600px 80px; animation-delay: -2.6s; }
#scene .bm4 { transform-origin: 800px 80px; animation-delay: -0.6s; animation-duration: 4.4s; }
#scene .bm5 { transform-origin: 0px 80px; animation-delay: -3.1s; }
#scene .bm6 { transform-origin: 1000px 80px; animation-delay: -1.9s; animation-duration: 5.6s; }
@keyframes beam-sway {
  from { transform: rotate(-9deg); }
  to   { transform: rotate(9deg); }
}

#scene .hero { transform: translate(500px, 366px) scale(0.92); }

#start-greg { width: clamp(220px, 40vw, 380px); }

/* ---------- the Greg rig ----------
   Every <g class="greg"> gets the same children from #greg-rig (theme.js copies them
   in). Each part carries its full resting transform here; every keyframe below repeats
   it, because a CSS transform replaces the element's transform outright.
   Torso and arms are separate <g class="upper"> groups — the kit is drawn between
   them — so both get the same animation and move as one body. */

.greg, .greg g, .greg use, .greg circle { transform-box: view-box; }

.greg .upper { transform: translate(0px, -100px); }
.greg .head  { transform: translate(0px, -92px); }
.greg .hair  { transform: translate(0px, -44px); }
.greg .arm-r { transform: translate(-40px, -84px) scale(-1, 1); }
.greg .arm-l { transform: translate(40px, -84px); }
.greg .wrist { transform: translate(4px, 52px) rotate(40deg); }
/* how far each stick swings to land: the right hand reaches the ride, the left the snare */
.greg .arm-r .wrist { --hit: 80deg; }
.greg .arm-l .wrist { --hit: 102deg; }

.greg .ride  { transform: translate(-112px, -146px); }
.greg .hat   { transform: translate(150px, -158px); }
.greg .snare { transform: translate(88px, -124px); }
.greg .kick  { transform: translate(0px, 0px); }
.greg .drop-stick { opacity: 0; }
.greg .drop-mirror { transform: scale(-1, 1); }

/* Faces: custom properties cascade into the <use> shadow trees */
.greg.happy  { --eyes-focus: none; --eyes-happy: block; --mouth-focus: none; --mouth-grin: block; }
.greg.oops   { --eyes-focus: none; --eyes-oops: block;  --mouth-focus: none; --mouth-oops: block; }
.greg.munchy { --eyes-focus: none; --eyes-happy: block; --mouth-focus: none; --mouth-munch: block; }

/* idle: nodding along to a song only he can hear */
@keyframes nod {
  0%, 100% { transform: translate(0px, -100px); }
  50%      { transform: translate(0px, -100px) scale(1, 0.97); }
}
@keyframes hair-nod {
  0%, 100% { transform: translate(0px, -44px); }
  50%      { transform: translate(0px, -45px) scale(1.02, 1.05); }
}
#scene .hero .upper { animation: nod 0.9s ease-in-out infinite; }
#scene .hero .hair  { animation: hair-nod 0.9s ease-in-out infinite; }

/* One hit: lean back, then flop the whole upper body forward toward the drum. */
@keyframes slam-l {
  0%, 100% { transform: translate(0px, -100px); }
  25%      { transform: translate(0px, -100px) rotate(-3deg) scale(1, 1.04); }
  55%      { transform: translate(0px, -100px) rotate(7deg) scale(1.05, 0.76); }
}
@keyframes slam-r {
  0%, 100% { transform: translate(0px, -100px); }
  25%      { transform: translate(0px, -100px) rotate(3deg) scale(1, 1.04); }
  55%      { transform: translate(0px, -100px) rotate(-7deg) scale(1.05, 0.76); }
}
/* the head goes further than the body, and comes toward us */
@keyframes head-dip {
  0%, 100% { transform: translate(0px, -92px); }
  25%      { transform: translate(0px, -95px); }
  55%      { transform: translate(0px, -70px) scale(1.16); }
}
/* the hair lags behind: flattens on the way back, flies up when the head drops */
@keyframes hair-fly {
  0%, 100% { transform: translate(0px, -44px); }
  30%      { transform: translate(0px, -42px) scale(1.04, 0.92); }
  62%      { transform: translate(0px, -56px) scale(1.16, 1.4); }
  82%      { transform: translate(0px, -42px) scale(1.02, 0.9); }
}
/* the stick winds up, then cracks down onto the drum */
@keyframes strike {
  0%, 100% { transform: translate(4px, 52px) rotate(40deg); }
  25%      { transform: translate(4px, 52px) rotate(4deg); }
  55%      { transform: translate(4px, 52px) rotate(var(--hit)); }
}
@keyframes drum-wobble-snare {
  0%, 100% { transform: translate(88px, -124px); }
  55%      { transform: translate(88px, -120px) scale(1.06, 0.92); }
  75%      { transform: translate(88px, -126px) scale(0.98, 1.04); }
}
@keyframes drum-wobble-ride {
  0%, 100% { transform: translate(-112px, -146px); }
  55%      { transform: translate(-112px, -140px) rotate(-7deg); }
  75%      { transform: translate(-112px, -148px) rotate(4deg); }
}
@keyframes kick-thump {
  0%, 100% { transform: translate(0px, 0px); }
  55%      { transform: translate(0px, 0px) scale(1.04); }
}

.greg.hit-l .upper { animation: slam-l 0.42s ease-in-out; }
.greg.hit-r .upper { animation: slam-r 0.42s ease-in-out; }
.greg.hit-l .head, .greg.hit-r .head { animation: head-dip 0.42s ease-in-out; }
.greg.hit-l .hair, .greg.hit-r .hair { animation: hair-fly 0.52s ease-out; }
.greg.hit-l .arm-l .wrist, .greg.hit-r .arm-r .wrist { animation: strike 0.42s ease-in; }
.greg.hit-l .snare { animation: drum-wobble-snare 0.42s ease-out; }
.greg.hit-r .ride  { animation: drum-wobble-ride 0.6s ease-out; }
.greg.hit-l .kick, .greg.hit-r .kick { animation: kick-thump 0.42s ease-out; }

/* Wrong letter: a stick flies out of his hand, clatters on the floor, and he grabs
   another one from nowhere, like drummers do. */
@keyframes stick-drop {
  0%   { transform: translate(44px, -132px) rotate(40deg); opacity: 1; }
  28%  { transform: translate(84px, -210px) rotate(250deg); opacity: 1; }
  62%  { transform: translate(150px, -4px) rotate(450deg); opacity: 1; }
  72%  { transform: translate(162px, -26px) rotate(470deg); opacity: 1; }
  82%  { transform: translate(172px, -4px) rotate(450deg); opacity: 1; }
  92%  { transform: translate(176px, -4px) rotate(450deg); opacity: 1; }
  100% { transform: translate(178px, -4px) rotate(450deg); opacity: 0; }
}
@keyframes fumble {
  0%, 100% { transform: translate(4px, 52px) rotate(40deg); }
  20%      { transform: translate(4px, 52px) rotate(-30deg); }
  40%      { transform: translate(4px, 52px) rotate(60deg); }
  60%      { transform: translate(4px, 52px) rotate(20deg); }
}
@keyframes stick-regrab {
  0%, 70% { opacity: 0; transform: scale(0.4); }
  100%    { opacity: 1; transform: scale(1); }
}
@keyframes flinch {
  0%, 100% { transform: translate(0px, -100px); }
  25%      { transform: translate(0px, -100px) scale(1, 1.05); }
  50%      { transform: translate(0px, -100px) rotate(-2deg) scale(1, 1.05); }
}
.greg.dropped-l .drop-l, .greg.dropped-r .drop-r { animation: stick-drop 1.1s ease-in forwards; }
.greg.dropped-l .arm-l .wrist, .greg.dropped-r .arm-r .wrist { animation: fumble 0.6s ease-in-out; }
.greg.dropped-l .arm-l .stick, .greg.dropped-r .arm-r .stick { animation: stick-regrab 1.1s ease-out; }
.greg.dropped-l .upper, .greg.dropped-r .upper { animation: flinch 0.7s ease-in-out; }

/* Continuous drumming, for the celebrations: a hit every --beat, alternating hands. */
@keyframes slam-lr {
  0%, 50%, 100% { transform: translate(0px, -100px); }
  12%  { transform: translate(0px, -100px) rotate(-3deg) scale(1, 1.04); }
  27%  { transform: translate(0px, -100px) rotate(7deg) scale(1.05, 0.76); }
  62%  { transform: translate(0px, -100px) rotate(3deg) scale(1, 1.04); }
  77%  { transform: translate(0px, -100px) rotate(-7deg) scale(1.05, 0.76); }
}
@keyframes strike-half {
  0%, 50%, 100% { transform: translate(4px, 52px) rotate(40deg); }
  12%  { transform: translate(4px, 52px) rotate(4deg); }
  27%  { transform: translate(4px, 52px) rotate(var(--hit)); }
}
@keyframes snare-beat {
  0%, 50%, 100% { transform: translate(88px, -124px); }
  27% { transform: translate(88px, -120px) scale(1.06, 0.92); }
}
@keyframes ride-beat {
  0%, 50%, 100% { transform: translate(-112px, -146px); }
  27% { transform: translate(-112px, -140px) rotate(-7deg); }
}
.greg.drumming { --beat: 0.4s; }
.greg.drumming .upper { animation: slam-lr calc(var(--beat) * 2) ease-in-out infinite; }
.greg.drumming .head  { animation: head-dip var(--beat) ease-in-out infinite; }
.greg.drumming .hair  { animation: hair-fly var(--beat) ease-out infinite; }
.greg.drumming .kick  { animation: kick-thump var(--beat) ease-out infinite; }
.greg.drumming .arm-l .wrist { animation: strike-half calc(var(--beat) * 2) ease-in infinite; }
.greg.drumming .arm-r .wrist { animation: strike-half calc(var(--beat) * 2) ease-in calc(var(--beat) * -1) infinite; }
.greg.drumming .snare { animation: snare-beat calc(var(--beat) * 2) ease-out infinite; }
.greg.drumming .ride  { animation: ride-beat calc(var(--beat) * 2) ease-out calc(var(--beat) * -1) infinite; }

/* ---------- shared celebration scenery ---------- */

#celebration .scene .floor { fill: #3a2418; }
#celebration .greg { transform: translate(400px, 464px); }
#celebration g { transform-box: view-box; }

#celebration .cb-note, #celebration .cb-star, #celebration .cb-heart, #celebration .cb-drop,
#celebration .cb-spark, #celebration .cb-bolt, #celebration .cb-o { opacity: 0; }

/* notes drift up and away from the kit */
@keyframes note-float {
  0%   { transform: translate(var(--x), var(--y)) scale(0.3) rotate(0deg); opacity: 0; }
  18%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) - 170px)) scale(1.1) rotate(var(--r)); opacity: 0; }
}
.cb-note.n1 { --x: 330px; --y: 330px; --dx: -90px;  --r: -20deg; --d: 0.3s; }
.cb-note.n2 { --x: 470px; --y: 320px; --dx: 100px;  --r: 18deg;  --d: 0.8s; }
.cb-note.n3 { --x: 300px; --y: 380px; --dx: -140px; --r: -30deg; --d: 1.4s; }
.cb-note.n4 { --x: 500px; --y: 370px; --dx: 150px;  --r: 26deg;  --d: 1.9s; }
.cb-note.n5 { --x: 360px; --y: 300px; --dx: -60px;  --r: -12deg; --d: 2.5s; }
.cb-note.n6 { --x: 440px; --y: 300px; --dx: 70px;   --r: 14deg;  --d: 3.0s; }
.scene.playing .cb-note { animation: note-float 2.2s ease-out var(--d) infinite; }

/* sweat flies off his hair */
@keyframes sweat {
  0%   { transform: translate(400px, 200px) scale(0.4); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: translate(calc(400px + var(--dx)), calc(200px + var(--dy))) scale(1); opacity: 0; }
}
.cb-drop.d1 { --dx: -150px; --dy: 40px;  --d: 0.4s; }
.cb-drop.d2 { --dx: 140px;  --dy: 20px;  --d: 0.9s; }
.cb-drop.d3 { --dx: -110px; --dy: -60px; --d: 1.5s; }
.cb-drop.d4 { --dx: 120px;  --dy: -70px; --d: 2.1s; }
.scene.playing .cb-drop { animation: sweat 1.1s ease-out var(--d) infinite; }

/* stars and hearts pop out from the middle */
@keyframes burst {
  0%   { transform: translate(var(--x0, 400px), var(--y0, 280px)) scale(0.2) rotate(0deg); opacity: 0; }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translate(calc(var(--x0, 400px) + var(--dx)), calc(var(--y0, 280px) + var(--dy))) scale(1.4) rotate(200deg); opacity: 0; }
}
.cb-star.s1 { --dx: -260px; --dy: -110px; --d: 3.4s; }
.cb-star.s2 { --dx: 250px;  --dy: -120px; --d: 3.5s; }
.cb-star.s3 { --dx: -200px; --dy: 60px;   --d: 3.6s; }
.cb-star.s4 { --dx: 220px;  --dy: 80px;   --d: 3.45s; }
.cb-star.s5 { --dx: -60px;  --dy: -160px; --d: 3.55s; }
.cb-star.s6 { --dx: 80px;   --dy: -150px; --d: 3.65s; }
.cb-heart.h1 { --dx: -170px; --dy: -120px; --d: 1.2s; }
.cb-heart.h2 { --dx: 180px;  --dy: -110px; --d: 2.2s; }
.cb-heart.h3 { --dx: 30px;   --dy: -170px; --d: 3.2s; }
.scene.playing .cb-star  { animation: burst 1.6s ease-out var(--d) 2; }
.scene.playing .cb-heart { animation: burst 2s ease-out var(--d) 2; }

/* ---------- Greg plays fast ---------- */

#scene-fast .zip { stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: 0; }
@keyframes zip {
  0%   { transform: translate(60px, 0px); opacity: 0; }
  30%  { opacity: 0.55; }
  100% { transform: translate(-60px, 0px); opacity: 0; }
}
#scene-fast.playing .zip { animation: zip 0.45s linear infinite; }
#scene-fast.playing .z2 { animation-delay: 0.15s; }
#scene-fast.playing .z3 { animation-delay: 0.3s; }
#scene-fast.playing .z4 { animation-delay: 0.08s; animation-direction: reverse; }
#scene-fast.playing .z5 { animation-delay: 0.22s; animation-direction: reverse; }
#scene-fast.playing .z6 { animation-delay: 0.36s; animation-direction: reverse; }
#scene-fast .cb-note { --d: 0s; }
#scene-fast.playing .cb-note { animation-duration: 1.1s; }
#scene-fast .n2 { --d: 0.2s; } #scene-fast .n3 { --d: 0.4s; } #scene-fast .n4 { --d: 0.6s; }
#scene-fast .n5 { --d: 0.8s; } #scene-fast .n6 { --d: 0.95s; }
/* the whole stage shakes */
@keyframes shake {
  0%, 100% { transform: translate(400px, 464px); }
  25% { transform: translate(397px, 465px); }
  75% { transform: translate(403px, 463px); }
}
#scene-fast.playing .greg { animation: shake 0.16s linear infinite; }

/* ---------- Greg plays slow ---------- */

@keyframes snail-crawl {
  from { transform: translate(-60px, 492px) scale(0.9); }
  to   { transform: translate(220px, 492px) scale(0.9); }
}
#scene-slow .snail-wrap { transform: translate(-60px, 492px) scale(0.9); }
#scene-slow.playing .snail-wrap { animation: snail-crawl 6.8s linear forwards; }
#scene-slow.playing .cb-note { animation-duration: 3.4s; }
#scene-slow .greg { --eyes-focus: none; --eyes-happy: block; }

/* ---------- rock & roll finish! ---------- */

/* a fast roll that speeds up (12 hits), then a held pose with both sticks in the air */
@keyframes finish-upper {
  0%   { transform: translate(0px, -100px) scale(1.05, 0.76); }
  40%  { transform: translate(0px, -100px) scale(1, 1.1); }
  100% { transform: translate(0px, -100px) scale(1, 1.06); }
}
@keyframes finish-hair {
  0%   { transform: translate(0px, -52px) scale(1.12, 1.3); }
  50%  { transform: translate(0px, -48px) scale(1.2, 1.2); }
  100% { transform: translate(0px, -46px) scale(1.14, 1.12); }
}
@keyframes sticks-up {
  0%   { transform: translate(4px, 52px) rotate(var(--hit)); }
  40%, 100% { transform: translate(4px, 52px) rotate(125deg); }
}
@keyframes arm-up-l {
  0%   { transform: translate(40px, -84px); }
  40%, 100% { transform: translate(40px, -84px) rotate(-110deg); }
}
@keyframes arm-up-r {
  0%   { transform: translate(-40px, -84px) scale(-1, 1); }
  40%, 100% { transform: translate(-40px, -84px) scale(-1, 1) rotate(-110deg); }
}
#scene-rocknroll.playing .greg .upper {
  animation: slam-lr 0.28s ease-in-out 12, finish-upper 0.9s ease-out 3.4s forwards;
}
#scene-rocknroll.playing .greg .head { animation: head-dip 0.14s ease-in-out 24; }
#scene-rocknroll.playing .greg .hair {
  animation: hair-fly 0.14s ease-out 24, finish-hair 1.2s ease-out 3.4s forwards;
}
#scene-rocknroll.playing .greg .arm-l .wrist {
  --hit: 102deg;
  animation: strike-half 0.28s ease-in 12, sticks-up 0.9s ease-out 3.4s forwards;
}
#scene-rocknroll.playing .greg .arm-r .wrist {
  --hit: 80deg;
  animation: strike-half 0.28s ease-in -0.14s 12, sticks-up 0.9s ease-out 3.4s forwards;
}
#scene-rocknroll.playing .greg .arm-l { animation: arm-up-l 0.9s ease-out 3.4s forwards; }
#scene-rocknroll.playing .greg .arm-r { animation: arm-up-r 0.9s ease-out 3.4s forwards; }
#scene-rocknroll.playing .greg .snare { animation: snare-beat 0.28s ease-out 12; }
#scene-rocknroll.playing .greg .ride  { animation: ride-beat 0.28s ease-out -0.14s 12, drum-wobble-ride 0.5s ease-out 3.4s 3; }
#scene-rocknroll.playing .greg .kick  { animation: kick-thump 0.14s ease-out 24; }
#scene-rocknroll .greg.finished { --eyes-focus: none; --eyes-happy: block; --mouth-focus: none; --mouth-grin: block; }

#scene-rocknroll .flash { opacity: 0.35; }
@keyframes flash {
  0%   { opacity: 0.35; }
  10%  { opacity: 1; }
  100% { opacity: 0.6; }
}
#scene-rocknroll.playing .flash { animation: flash 1.4s ease-out 3.4s forwards; }

@keyframes bolt {
  0%   { opacity: 0; transform: translate(var(--x), 230px) scale(0.3) rotate(var(--r)); }
  15%  { opacity: 1; transform: translate(var(--x), 230px) scale(1.5) rotate(var(--r)); }
  100% { opacity: 1; transform: translate(var(--x), 230px) scale(1.3) rotate(var(--r)); }
}
.cb-bolt.b1 { --x: 170px; --r: -12deg; }
.cb-bolt.b2 { --x: 630px; --r: 12deg; }
#scene-rocknroll.playing .cb-bolt { animation: bolt 1s ease-out 3.4s forwards; }

/* pyro fountains either side of the kit */
@keyframes pyro {
  0%   { transform: translate(var(--x), 462px) scale(0.3); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: translate(calc(var(--x) + var(--dx)), 250px) scale(1); opacity: 0; }
}
.cb-spark.k1 { --x: 150px; --dx: -30px; --d: 3.4s; }
.cb-spark.k2 { --x: 160px; --dx: 20px;  --d: 3.6s; }
.cb-spark.k3 { --x: 150px; --dx: -5px;  --d: 3.8s; }
.cb-spark.k4 { --x: 650px; --dx: 30px;  --d: 3.45s; }
.cb-spark.k5 { --x: 640px; --dx: -20px; --d: 3.65s; }
.cb-spark.k6 { --x: 650px; --dx: 5px;   --d: 3.85s; }
#scene-rocknroll.playing .cb-spark { animation: pyro 0.8s ease-out var(--d) 4; }

/* ---------- drum solo ---------- */

#scene-solo .spot { opacity: 0.35; mix-blend-mode: screen; }
@keyframes spot-pulse {
  0%, 100% { opacity: 0.25; }
  50%      { opacity: 0.45; }
}
#scene-solo.playing .spot { animation: spot-pulse 0.52s ease-in-out infinite; }
#scene-solo .cb-star.s1 { --d: 1.2s; } #scene-solo .cb-star.s2 { --d: 2.4s; } #scene-solo .cb-star.s3 { --d: 3.6s; }

/* ---------- practice ---------- */

#scene-practice .practice-floor { fill: #8a6a44; }
#scene-practice .metro .pendulum { transform: translate(0px, -10px); }
@keyframes tick {
  from { transform: translate(0px, -10px) rotate(-26deg); }
  to   { transform: translate(0px, -10px) rotate(26deg); }
}
#scene-practice.playing .metro .pendulum { animation: tick 0.5s ease-in-out infinite alternate; }
@keyframes spin { to { transform: rotate(360deg); } }
#scene-practice.playing .clock .hand-m { animation: spin 0.6s linear infinite; }
#scene-practice.playing .clock .hand-h { animation: spin 7.2s linear infinite; }
#scene-practice .greg { transform: translate(360px, 464px); }
#scene-practice .cb-drop { --x0: 360px; }
@keyframes sweat-practice {
  0%   { transform: translate(360px, 200px) scale(0.4); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: translate(calc(360px + var(--dx)), calc(200px + var(--dy))) scale(1); opacity: 0; }
}
#scene-practice.playing .cb-drop { animation: sweat-practice 1s ease-out var(--d) infinite; }

/* ---------- on tour ---------- */

@keyframes hills-scroll {
  from { transform: translate(0px, 0px); }
  to   { transform: translate(-400px, 0px); }
}
@keyframes road-scroll {
  from { transform: translate(0px, 0px); }
  to   { transform: translate(-80px, 0px); }
}
#scene-tour.playing .hills { animation: hills-scroll 3s linear infinite; }
#scene-tour.playing .road-dash { animation: road-scroll 0.35s linear infinite; }
/* drives in, bounces along for a while, then off to the next town */
@keyframes van-drive {
  0%   { transform: translate(-200px, 482px); }
  28%  { transform: translate(380px, 482px); }
  80%  { transform: translate(420px, 482px); }
  100% { transform: translate(1000px, 482px); }
}
@keyframes van-bounce {
  0%, 100% { translate: 0px 0px; }
  50%      { translate: 0px -6px; }
}
#scene-tour .van-wrap { transform: translate(-200px, 482px); }
#scene-tour.playing .van-wrap {
  animation: van-drive 6.8s ease-in-out forwards, van-bounce 0.3s ease-in-out infinite;
}
@keyframes hair-blow {
  0%, 100% { transform: scale(1, 1) rotate(0deg); }
  50%      { transform: scale(1.1, 0.94) rotate(-8deg); }
}
#scene-tour.playing .van-greg .hair { animation: hair-blow 0.24s ease-in-out infinite; }
#scene-tour .cb-note { --y: 330px; }
#scene-tour .cb-note.n1 { --x: 320px; } #scene-tour .cb-note.n2 { --x: 420px; } #scene-tour .cb-note.n3 { --x: 500px; }
#scene-tour .cb-heart { --y0: 330px; }

/* ---------- The Sinclair ---------- */

#scene-sinclair .greg { transform: translate(400px, 452px) scale(0.72); }
#scene-sinclair .sweep { fill: #ff8fb8; opacity: 0.16; mix-blend-mode: screen; }
#scene-sinclair .sw1 { transform-origin: 140px 100px; }
#scene-sinclair .sw2 { transform-origin: 660px 100px; fill: #9fdcff; }
#scene-sinclair.playing .sweep { animation: beam-sway 1.6s ease-in-out infinite alternate; }
#scene-sinclair.playing .sw2 { animation-delay: -0.8s; }
@keyframes bulbs {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.35; }
}
#scene-sinclair.playing .bulbs { animation: bulbs 0.5s steps(1) infinite; }
@keyframes stamp {
  0%   { transform: translate(590px, 166px) rotate(-12deg) scale(3); opacity: 0; }
  60%  { transform: translate(590px, 166px) rotate(-12deg) scale(0.9); opacity: 1; }
  100% { transform: translate(590px, 166px) rotate(-12deg) scale(1); opacity: 1; }
}
#scene-sinclair .soldout { opacity: 0; }
#scene-sinclair.playing .soldout { animation: stamp 0.5s ease-out 1s forwards; }

#scene-sinclair .fan { --fan: #1e1030; transform: translate(var(--fx), 508px); }
#scene-sinclair .fan .arm { transform: translate(18px, -30px) rotate(20deg); }
@keyframes fan-bob {
  from { transform: translate(var(--fx), 508px); }
  to   { transform: translate(var(--fx), 496px); }
}
@keyframes fan-wave {
  from { transform: translate(18px, -30px) rotate(-10deg); }
  to   { transform: translate(18px, -30px) rotate(30deg); }
}
#scene-sinclair.playing .fan { animation: fan-bob 0.3s ease-in-out var(--d) infinite alternate; }
#scene-sinclair.playing .fan .arm { animation: fan-wave 0.6s ease-in-out var(--d) infinite alternate; }
.fan.f1  { --fx: 30px;  --d: -0.1s;  --fan: #2a1640; }
.fan.f2  { --fx: 100px; --d: -0.25s; }
.fan.f3  { --fx: 170px; --d: -0.05s; --fan: #2a1640; }
.fan.f4  { --fx: 240px; --d: -0.2s; }
.fan.f5  { --fx: 310px; --d: -0.15s; --fan: #2a1640; }
.fan.f6  { --fx: 380px; --d: 0s; }
.fan.f7  { --fx: 450px; --d: -0.22s; --fan: #2a1640; }
.fan.f8  { --fx: 520px; --d: -0.08s; }
.fan.f9  { --fx: 590px; --d: -0.18s; --fan: #2a1640; }
.fan.f10 { --fx: 660px; --d: -0.03s; }
.fan.f11 { --fx: 740px; --d: -0.27s; --fan: #2a1640; }
#scene-sinclair .cb-heart, #scene-sinclair .cb-star { --y0: 260px; }
#scene-sinclair .cb-star.s1 { --d: 1.6s; } #scene-sinclair .cb-star.s2 { --d: 2.8s; }

/* ---------- cereal ---------- */

/* the bowl sits on top of the kick drum and jumps with every hit */
#scene-cereal .bowl { transform: translate(400px, 326px); }
@keyframes bowl-hop {
  0%, 100% { transform: translate(400px, 326px); }
  30%      { transform: translate(400px, 318px) rotate(-3deg); }
}
#scene-cereal.playing .bowl { animation: bowl-hop 0.5s ease-out infinite; }
/* ...and every hit bounces a cereal O straight into his mouth */
@keyframes o-hop {
  0%   { transform: translate(var(--ox), 312px) scale(0.6); opacity: 0; }
  3%   { opacity: 1; }
  16%  { transform: translate(calc(var(--ox) * 0.5 + 200px), 232px) scale(1.2) rotate(180deg); opacity: 1; }
  27%  { transform: translate(400px, 256px) scale(0.7) rotate(300deg); opacity: 1; }
  30%, 100% { transform: translate(400px, 258px) scale(0.3); opacity: 0; }
}
/* six O's, one per beat, on a 3s loop */
.cb-o.o1 { --ox: 380px; --d: 0.25s; }
.cb-o.o2 { --ox: 420px; --d: 0.75s; }
.cb-o.o3 { --ox: 390px; --d: 1.25s; }
.cb-o.o4 { --ox: 412px; --d: 1.75s; }
.cb-o.o5 { --ox: 372px; --d: 2.25s; }
.cb-o.o6 { --ox: 426px; --d: 2.75s; }
#scene-cereal.playing .cb-o { animation: o-hop 3s ease-in-out var(--d) infinite; }
#scene-cereal .cb-heart { --y0: 250px; }
</style>
</head>
<body>

<!-- ======= shared art (referenced everywhere via <use>) =======
     Greg is a rig of parts, each drawn with its pivot at the origin:
       #greg-legs  — origin on the floor under the stool, hips at y = -100
       #greg-body  — the shirt, origin at the hips
       #greg-head  — neck + face, origin at the base of the neck
       #greg-hair  — the mop, origin at the centre of his head
       #greg-arm   — his LEFT arm (on the viewer's right), origin at the shoulder,
                     hand at (4, 52); the right arm is the same art under scale(-1, 1)
       #stick-proto — a drumstick, origin at the grip, pointing straight up
     #greg-rig (below, in <defs>) is the whole drummer-plus-kit assembly; theme.js
     copies its children into every <g class="greg"> on the page, so the main scene and
     every celebration share one rig and one set of CSS (theme.css "the Greg rig"). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1b0f2e"/>
      <stop offset="0.6" stop-color="#2c1440"/>
      <stop offset="1"   stop-color="#3b1a45"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cymbal-grad" cx="42%" cy="40%" r="70%">
      <stop offset="0"    stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e2b34a"/>
      <stop offset="1"    stop-color="#a8762a"/>
    </radialGradient>

    <!-- ---------- Greg ---------- -->

    <!-- legs in jeans, mostly hidden behind the kick drum -->
    <g id="greg-legs">
      <path d="M -30,-104 C -52,-100 -64,-88 -68,-72 L -64,-4 L -48,-4 L -50,-68 C -44,-80 -30,-84 -18,-86 Z"
        fill="#34466e"/>
      <path d="M 30,-104 C 52,-100 64,-88 68,-72 L 64,-4 L 48,-4 L 50,-68 C 44,-80 30,-84 18,-86 Z"
        fill="#34466e"/>
      <path d="M -70,-8 Q -72,4 -56,4 L -40,4 Q -40,-8 -50,-10 Z" fill="#2a2320"/>
      <path d="M 70,-8 Q 72,4 56,4 L 40,4 Q 40,-8 50,-10 Z" fill="#2a2320"/>
    </g>

    <!-- the teal t-shirt: origin at the hips, shoulders at y = -86 -->
    <g id="greg-body">
      <path d="M -36,6 C -40,-24 -46,-56 -46,-78 Q -30,-94 0,-94 Q 30,-94 46,-78
               C 46,-56 40,-24 36,6 Z" fill="var(--shirt, #1f8f86)"/>
      <path d="M 14,-92 Q 30,-92 46,-78 C 46,-56 40,-24 36,6 L 20,6 C 26,-30 26,-60 14,-92 Z"
        fill="var(--shirt-shade, #16706a)"/>
      <!-- collar -->
      <path d="M -13,-94 Q 0,-80 13,-94" stroke="var(--shirt-shade, #16706a)" stroke-width="4"
        fill="none" stroke-linecap="round"/>
      <path d="M -11,-94 Q 0,-84 11,-94 Z" fill="#e9b594"/>
    </g>

    <!-- neck and face: origin at the base of the neck, head centre at (0, -44) -->
    <g id="greg-head">
      <rect x="-9" y="-22" width="18" height="24" rx="5" fill="#e0a887"/>
      <!-- ears -->
      <ellipse cx="-24" cy="-40" rx="5" ry="8" fill="#e9b594"/>
      <ellipse cx="24"  cy="-40" rx="5" ry="8" fill="#e9b594"/>
      <!-- a long face with a narrow chin -->
      <path d="M -23,-58 C -24,-30 -18,-12 0,-10 C 18,-12 24,-30 23,-58 C 20,-76 -20,-76 -23,-58 Z"
        fill="#f0c5a4"/>
      <!-- stubble -->
      <path d="M -17,-26 C -14,-14 -6,-11 0,-11 C 6,-11 14,-14 17,-26 C 10,-18 -10,-18 -17,-26 Z"
        fill="#c79a7c" opacity="0.55"/>
      <!-- nose -->
      <path d="M 0,-46 L -4,-32 Q 0,-30 4,-32" stroke="#c98c6c" stroke-width="2"
        fill="none" stroke-linecap="round"/>
      <ellipse cx="-13" cy="-33" rx="4.5" ry="2.6" fill="#ee9f8a" opacity="0.45"/>
      <ellipse cx="13"  cy="-33" rx="4.5" ry="2.6" fill="#ee9f8a" opacity="0.45"/>

      <!-- eyes: concentrating, looking down at the drums (the photo face) -->
      <g style="display: var(--eyes-focus, block)">
        <path d="M -16,-51 Q -10,-55 -4,-52" stroke="#5a3218" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M 4,-52 Q 10,-55 16,-51"   stroke="#5a3218" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M -15,-44 Q -10,-41 -5,-44 Q -10,-46.5 -15,-44 Z" fill="#fff"/>
        <path d="M 5,-44 Q 10,-41 15,-44 Q 10,-46.5 5,-44 Z" fill="#fff"/>
        <circle cx="-10" cy="-43.4" r="2" fill="#2b1a10"/>
        <circle cx="10"  cy="-43.4" r="2" fill="#2b1a10"/>
        <path d="M -15.5,-45 Q -10,-48 -4.5,-45" stroke="#7a4a30" stroke-width="1.6" fill="none"/>
        <path d="M 4.5,-45 Q 10,-48 15.5,-45"   stroke="#7a4a30" stroke-width="1.6" fill="none"/>
      </g>
      <!-- eyes: happy -->
      <g style="display: var(--eyes-happy, none)" stroke="#2b1a10" stroke-width="2.6"
         fill="none" stroke-linecap="round">
        <path d="M -15,-43 Q -10,-49 -5,-43"/>
        <path d="M 5,-43 Q 10,-49 15,-43"/>
      </g>
      <!-- eyes: oops (wide) -->
      <g style="display: var(--eyes-oops, none)">
        <path d="M -16,-55 Q -10,-60 -4,-56" stroke="#5a3218" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M 4,-56 Q 10,-60 16,-55"   stroke="#5a3218" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="-10" cy="-44" r="5" fill="#fff"/>
        <circle cx="10"  cy="-44" r="5" fill="#fff"/>
        <circle cx="-10" cy="-44" r="2.4" fill="#2b1a10"/>
        <circle cx="10"  cy="-44" r="2.4" fill="#2b1a10"/>
      </g>

      <!-- mouths -->
      <path style="display: var(--mouth-focus, block)" d="M -7,-22 Q 0,-24 7,-21"
        stroke="#9a5646" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <g style="display: var(--mouth-grin, none)">
        <path d="M -10,-25 Q 0,-12 10,-25 Z" fill="#6b2a22"/>
        <path d="M -8,-24.5 L 8,-24.5 L 7,-22 L -7,-22 Z" fill="#fff"/>
      </g>
      <ellipse style="display: var(--mouth-oops, none)" cx="0" cy="-21" rx="4" ry="5" fill="#6b2a22"/>
      <g style="display: var(--mouth-munch, none)">
        <ellipse cx="0" cy="-21" rx="7" ry="5.5" fill="#6b2a22"/>
        <ellipse cx="0" cy="-18.6" rx="4" ry="2.2" fill="#e88c86"/>
      </g>
    </g>

    <!-- the mop: origin at the centre of his head. Curls drawn dark to light, so the
         lumps catch the stage lights on top. -->
    <g id="greg-hair">
      <!-- the outline of the mop: wide, lumpy, a few stray curls -->
      <g fill="var(--hair-dark, #4a2612)">
        <circle cx="-40" cy="-14" r="21"/><circle cx="40" cy="-14" r="21"/>
        <circle cx="-50" cy="6"   r="15"/><circle cx="51" cy="7"   r="15"/>
        <circle cx="-56" cy="-32" r="13"/><circle cx="57" cy="-30" r="13"/>
        <circle cx="-30" cy="-56" r="17"/><circle cx="30" cy="-57" r="16"/>
        <circle cx="0"   cy="-64" r="18"/>
        <circle cx="-58" cy="18"  r="10"/><circle cx="60" cy="20"  r="10"/>
        <circle cx="-64" cy="-12" r="10"/><circle cx="65" cy="-10" r="9"/>
        <circle cx="-16" cy="-72" r="10"/><circle cx="18" cy="-73" r="9"/>
      </g>
      <g fill="var(--hair, #6e3b1e)">
        <circle cx="-28" cy="-36" r="22"/><circle cx="28" cy="-36" r="22"/>
        <circle cx="-9"  cy="-48" r="24"/><circle cx="11" cy="-48" r="24"/>
        <circle cx="-44" cy="-12" r="15"/><circle cx="44" cy="-12" r="15"/>
        <circle cx="-47" cy="6"   r="11"/><circle cx="48" cy="7"   r="11"/>
        <circle cx="-50" cy="-34" r="10"/><circle cx="52" cy="-32" r="10"/>

<script>
/*
 * Spelling-game rules — pure, no DOM, no theme.
 *
 * Every themed game (Spellaluna, Spellasaurus, ...) shares this: a shuffled word queue
 * with no immediate repeats, letter-by-letter matching, and a celebration picked after
 * each finished word.
 *
 * UMD-ish: usable as a classic <script> (window.SpellRules) and via require() in tests.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.SpellRules = api;
  }
})(typeof self !== 'undefined' ? self : this, function () {

  function shuffle(arr, rng) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function pickFrom(list, rng) {
    return list[Math.min(Math.floor(rng() * list.length), list.length - 1)];
  }

  /*
   * createGame({ words, rng, celebrations })
   *
   * celebrations describes how the reward after each word is chosen:
   *   pool:   celebration names to draw from
   *   pick:   'cycle'  — walk the pool in order (1st word, 2nd word, ...)
   *           'random' — pick at random, never the same one twice in a row
   *   finale: { name, every } — optional; replaces the pool pick on every Nth word
   */
  function createGame(opts) {
    opts = opts || {};
    const allWords = (opts.words || []).slice();
    if (!allWords.length) throw new Error('createGame needs a non-empty words list');
    const rng = opts.rng || Math.random;
    const cel = opts.celebrations || {};
    const finale = cel.finale && cel.finale.name
      ? { name: cel.finale.name, every: cel.finale.every || 3 }
      : null;
    return {
      allWords,
      rng,
      celebrations: {
        pool: (cel.pool || []).slice(),
        pick: cel.pick === 'random' ? 'random' : 'cycle',
        finale,
      },
      queue: shuffle(allWords, rng),
      wordIndex: 0,
      letterIndex: 0,
      wordsCompleted: 0,
      poolPicks: 0,          // pool position; finales don't advance it
      lastCelebration: null,
    };
  }

  function getCurrentWord(game) {
    return game.queue[game.wordIndex];
  }

  function getLetterIndex(game) {
    return game.letterIndex;
  }

  /* Swap the word being spelled right now (the add-a-word feature). */
  function replaceCurrentWord(game, word) {
    game.queue[game.wordIndex] = word;
    game.letterIndex = 0;
    if (!game.allWords.includes(word)) game.allWords.push(word);
  }

  function advanceWord(game) {
    const lastWord = getCurrentWord(game);
    game.wordIndex++;
    game.letterIndex = 0;
    if (game.wordIndex >= game.queue.length) {
      const next = shuffle(game.allWords, game.rng);
      if (next.length > 1 && next[0] === lastWord) {
        [next[0], next[next.length - 1]] = [next[next.length - 1], next[0]];
      }
      game.queue = next;
      game.wordIndex = 0;
    }
  }

  /* Which reward plays now that `game.wordsCompleted` words are done. */
  function chooseCelebration(game) {
    const c = game.celebrations;
    const n = game.wordsCompleted;
    if (c.finale && n % c.finale.every === 0) {
      return { celebration: c.finale.name, finale: true };
    }
    if (!c.pool.length) return { celebration: null, finale: false };

    let name;
    if (c.pick === 'cycle') {
      name = c.pool[game.poolPicks % c.pool.length];
    } else {
      // never the same happy animation twice in a row — variety matters to a small human
      const choices = c.pool.length > 1
        ? c.pool.filter((x) => x !== game.lastCelebration)
        : c.pool;
      name = pickFrom(choices, game.rng);
    }
    game.poolPicks++;
    game.lastCelebration = name;
    return { celebration: name, finale: false };
  }

  /*
   * Feed one keypress into the game. Mutates `game` and returns an event:
   *   {type:'ignored'}
   *   {type:'incorrect', letter, expected}
   *   {type:'correct', letter, index}
   *   {type:'word-complete', word, letter, index, celebration, finale, wordsCompleted}
   * After 'word-complete' the game has already advanced to the next word.
   */
  function inputLetter(game, raw) {
    const letter = String(raw || '').toUpperCase();
    const word = getCurrentWord(game);
    // a hyphen is typeable only in words that have one (HI-HAT); elsewhere it's ignored
    const typeable = /^[A-Z]$/.test(letter) || (letter === '-' && word.includes('-'));
    if (!typeable) return { type: 'ignored' };

    const expected = word[game.letterIndex];
    if (letter !== expected) {
      return { type: 'incorrect', letter, expected };
    }

    const index = game.letterIndex;
    game.letterIndex++;
    if (game.letterIndex >= word.length) {
      game.wordsCompleted++;
      const chosen = chooseCelebration(game);
      advanceWord(game);
      return {
        type: 'word-complete',
        word,
        letter,
        index,
        celebration: chosen.celebration,
        finale: chosen.finale,
        wordsCompleted: game.wordsCompleted,
      };
    }
    return { type: 'correct', letter, index };
  }

  return {
    createGame,
    getCurrentWord,
    getLetterIndex,
    replaceCurrentWord,
    inputLetter,
    shuffle,
  };
});
</script>
<script>
/*
 * Shared effects toolkit: Web Audio primitives, speech, and the sprite animations both
 * games use (a treat flying from a tile to the hero's mouth, a critter scurrying past).
 * Art is always supplied by the theme as an SVG <defs> id — this file never names one.
 *
 * Exposes window.SpellFx.
 */

  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  let muted = false;
  let actx = null;
  let trayEl = null;

  // Must be called from inside a user gesture the first time, or the context stays suspended.
  function ctx() {

      const AC = window.AudioContext || window.webkitAudioContext;

    osc.stop(t0 + dur + 0.05);

    const filter = c.createBiquadFilter();
    filter.type = filterType || 'bandpass';
    filter.frequency.setValueAtTime(filterHz || 1200, t0);
    const gain = c.createGain();
    gain.gain.setValueAtTime(peak || 0.18, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(gain).connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur);
  }

  /* ---------- speech ---------- */

  function say(text, opts) {
    opts = opts || {};
    if (muted || !window.speechSynthesis) return;
    if (opts.cancel !== false) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 0.9;
    u.pitch = opts.pitch || 1.15;
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  /* Letters and all-caps words are read as "capital B" / acronyms — always lowercase. */
  function sayWord(word, opts) {
    say(String(word).toLowerCase(), opts);
  }

  function setMuted(next) {
    muted = next;
    if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function isMuted() {
    return muted;
  }

  /* ---------- sprites ---------- */

  function sprite(protoId, size, viewBox) {
    const wrap = document.createElement('div');
    wrap.className = 'sprite';
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', viewBox || '-32 -32 64 64');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + protoId);
    svg.appendChild(use);
    wrap.appendChild(svg);
    document.body.appendChild(wrap);
    return wrap;
  }

  /*
   * Arc a treat from a letter tile up to the hero's mouth, then hand off to onArrive.
   * opts: { proto, size, fromEl, toEl, viewBox, duration, lift, spin, onArrive }
   */
  function flyTo(opts) {
    const size = opts.size || 84;
    const from = opts.fromEl.getBoundingClientRect();
    const to = opts.toEl.getBoundingClientRect();
    const s = sprite(opts.proto, size, opts.viewBox);
    const x0 = from.left + from.width / 2 - size / 2;
    const y0 = from.top - size / 2;
    s.style.left = x0 + 'px';
    s.style.top = y0 + 'px';
    const dx = to.left + to.width / 2 - size / 2 - x0;
    const dy = to.top + to.height / 2 - size / 2 - y0;
    const lift = opts.lift == null ? 90 : opts.lift;
    const spin = opts.spin == null ? 330 : opts.spin;

    const anim = s.animate(
      [
        { transform: 'translate(0px, 0px) scale(0.4) rotate(0deg)', opacity: 1 },
        {
          transform: `translate(${dx * 0.45}px, ${dy * 0.5 - lift}px) scale(1.1) rotate(${spin * 0.48}deg)`,
          opacity: 1,
          offset: 0.55,
        },
        { transform: `translate(${dx}px, ${dy}px) scale(0.45) rotate(${spin}deg)`, opacity: 0.9 },
      ],
      { duration: opts.duration || 800, easing: 'ease-in-out' }
    );
    anim.onfinish = () => {
      s.remove();
      if (opts.onArrive) opts.onArrive();
    };
    return s;
  }

  /* A critter wanders in under the tiles and scurries off one side. */
  function crawlPast(opts) {
    const size = opts.size || 120;
    const area = opts.areaEl.getBoundingClientRect();
    const x0 = area.left + area.width * (0.15 + Math.random() * 0.7);
    const y0 = area.bottom + (opts.drop == null ? 18 : opts.drop);
    const s = sprite(opts.proto, size, opts.viewBox);
    s.style.left = x0 + 'px';
    s.style.top = y0 + 'px';
    const dir = Math.random() < 0.5 ? -1 : 1;
    const dist = (window.innerWidth / 2 + size) * dir;
    const flip = dir < 0 ? ' scale(-1, 1)' : '';
    const wobble = opts.wobble == null ? 8 : opts.wobble;

    const anim = s.animate(
      [
        { transform: `translate(0,0) scale(0.2)${flip}`, opacity: 0 },
        { transform: `translate(${dist * 0.05}px, -6px)${flip}`, opacity: 1, offset: 0.15 },
        { transform: `translate(${dist * 0.3}px, 4px) rotate(${wobble * dir}deg)${flip}`, offset: 0.45 },
        { transform: `translate(${dist * 0.6}px, -4px) rotate(${-wobble * dir}deg)${flip}`, offset: 0.7 },
        { transform: `translate(${dist}px, 2px)${flip}`, opacity: 1 },
      ],
      { duration: opts.duration || 1700, easing: 'linear' }
    );
    anim.onfinish = () => s.remove();
    return s;
  }

  /* ---------- the collection tray (fruit eaten / leaves munched) ---------- */

  function useTray(el) {
    trayEl = el;
  }

  function addToTray(protoId, viewBox, max) {
    if (!trayEl) return;
    if (trayEl.children.length >= (max || 18)) trayEl.innerHTML = '';
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', viewBox || '-26 -30 52 56');
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + protoId);
    svg.appendChild(use);
    trayEl.appendChild(svg);
  }

  /* ---------- mood classes (a temporary face on a <use> element) ---------- */

  const moodTimers = new Map();

  function mood(el, cls, ms, siblings) {
    if (!el) return;
    for (const other of siblings || []) el.classList.remove(other);
    if (moodTimers.has(el)) clearTimeout(moodTimers.get(el));
    if (!cls) return;
    el.classList.add(cls);
    moodTimers.set(el, setTimeout(() => el.classList.remove(cls), ms));
  }

  function rand(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  window.SpellFx = {
    ctx, tone, sweep, noise,
    say, sayWord, setMuted, isMuted,
    sprite, flyTo, crawlPast,
    useTray, addToTray,
    mood, rand,
    SVG_NS,
  };
})();
</script>
<script>
/*
 * The game shell, shared by every theme.
 *
 * Owns: the phase machine, keyboard input, letter tiles, the celebration sequencer,
 * the add-a-word modal and the mute button. Knows nothing about bats, dinosaurs,
 * fruit or leaves — a theme supplies words, art, sounds and celebration scenes, and
 * calls SpellEngine.boot(theme) once its <script> has loaded.
 *
 * The theme's page must provide: #tiles, #hint, #start-overlay, #celebration,
 * #celebration-word, #celebration-caption, one #scene-<name> per celebration, and
 * optionally #tray. Everything else on the page is the theme's own art.
 */
(function () {
  'use strict';

  const R = window.SpellRules;
  const fx = window.SpellFx;

  let theme = null;
  let game = null;
  let phase = 'start'; // 'start' | 'playing' | 'celebrating' | 'adding-word'
  let sceneCleanup = null;
  let celebrationTimers = [];
  const el = {};

  /* ---------- chrome the engine owns outright ---------- */

  function buildChrome() {
    const mute = document.createElement('button');
    mute.id = 'mute';
    mute.setAttribute('aria-label', 'Toggle sound');
    mute.textContent = '🔊';
    mute.addEventListener('click', () => {
      fx.setMuted(!fx.isMuted());
      mute.textContent = fx.isMuted() ? '🔇' : '🔊';
    });
    document.body.appendChild(mute);

    const modal = document.createElement('div');
    modal.id = 'add-word-modal';
    modal.className = 'overlay';
    modal.hidden = true;
    modal.innerHTML = `
      <div id="add-word-card">
        <label for="add-word-input"></label>
        <input id="add-word-input" type="text" maxlength="20"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <div id="add-word-error" hidden></div>
        <div id="add-word-buttons">
          <button id="add-word-confirm">Add word</button>
          <button id="add-word-cancel">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(modal);

    el.addWordModal = modal;
    el.addWordLabel = modal.querySelector('label');
    el.addWordInput = modal.querySelector('#add-word-input');
    el.addWordError = modal.querySelector('#add-word-error');
    el.addWordLabel.textContent =
      theme.addWordLabel || `Add a word for ${theme.name || 'the game'} to spell:`;

    modal.querySelector('#add-word-confirm').addEventListener('click', confirmAddWord);
    modal.querySelector('#add-word-cancel').addEventListener('click', closeAddWordModal);
    el.addWordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  { e.preventDefault(); confirmAddWord(); }
      if (e.key === 'Escape') { e.preventDefault(); closeAddWordModal(); }
    });
  }

  /* ---------- words and tiles ---------- */

  function renderWord(word) {
    el.tiles.innerHTML = '';
    // tiles shrink to fit long words (TYRANNOSAURUS is 13 of them)
    el.tiles.style.setProperty('--n', word.length);
    for (const letter of word) {
      const tile = document.createElement('span');
      tile.className = 'tile';
      tile.textContent = letter;
      el.tiles.appendChild(tile);
    }
  }

  function startWord() {
    const word = R.getCurrentWord(game);
    renderWord(word);
    el.hint.textContent = theme.hint || '';
    fx.sayWord(word, { rate: 0.75 });
    if (theme.onWordStart) theme.onWordStart(word);
  }

  /* ---------- per-letter feedback ---------- */

  function handleCorrect(ev) {
    const tileEl = el.tiles.children[ev.index];
    tileEl.classList.add('done');
    fx.sayWord(ev.letter === '-' ? 'hyphen' : ev.letter);
    if (theme.onCorrect) theme.onCorrect({ tileEl, index: ev.index, letter: ev.letter });
  }

  function handleIncorrect(ev) {
    if (theme.onIncorrect) theme.onIncorrect({ letter: ev.letter, expected: ev.expected });
  }

  function handleWordComplete(ev) {
    handleCorrect(ev);
    phase = 'celebrating';
    // a beat between the last letter and the fanfare — the pause is part of the reward
    celebrationTimers.push(setTimeout(() => {
      if (theme.onWordComplete) theme.onWordComplete(ev);
      fx.sayWord(ev.word + '!', { rate: 0.75 });
      celebrate(ev);
    }, theme.completeDelay || 700));
  }

  /* ---------- celebrations ---------- */

  function sceneFor(name) {
    const spec = theme.scenes[name];
    if (!spec) return null;
    return document.querySelector(spec.selector || '#scene-' + name);
  }

  function allScenes() {
    return Object.keys(theme.scenes).map(sceneFor).filter(Boolean);
  }

  function celebrate(ev) {
    const spec = theme.scenes[ev.celebration];
    const scene = sceneFor(ev.celebration);
    if (!spec || !scene) { endCelebration(); return; }

    el.celebrationWord.textContent = ev.word;
    el.celebrationCaption.textContent = spec.caption || '';
    el.celebration.hidden = false;
    el.celebration.classList.toggle('finale', !!ev.finale);

    // SVG elements have no .hidden property — the attribute is the only thing that works
    for (const s of allScenes()) {
      s.setAttribute('hidden', '');
      s.classList.remove('playing');
    }
    scene.removeAttribute('hidden');
    // next frame, so re-adding .playing restarts the CSS animations from the top
    requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add('playing')));

    if (spec.start) sceneCleanup = spec.start(scene, ev) || null;

    if (spec.caption) {
      celebrationTimers.push(setTimeout(() => fx.say(spec.caption, { cancel: false }), 1200));
    }
    celebrationTimers.push(setTimeout(endCelebration, spec.duration || 6500));
  }

  function endCelebration() {
    el.celebration.hidden = true;
    el.celebration.classList.remove('finale');
    for (const s of allScenes()) s.classList.remove('playing');
    if (sceneCleanup) sceneCleanup();
    sceneCleanup = null;
    clearTimers();
    phase = 'playing';
    startWord();
  }

  function clearTimers() {
    celebrationTimers.forEach(clearTimeout);
    celebrationTimers = [];
  }

  /* ---------- add-a-word modal ---------- */

  function openAddWordModal() {
    phase = 'adding-word';
    el.addWordInput.value = '';
    el.addWordError.hidden = true;
    el.addWordModal.hidden = false;
    el.addWordInput.focus();
  }

  function closeAddWordModal() {
    el.addWordModal.hidden = true;
    phase = 'playing';
  }

  function confirmAddWord() {
    const word = el.addWordInput.value.trim().toUpperCase();
    if (!word || !/^[A-Z]+(-[A-Z]+)*$/.test(word)) {
      el.addWordError.textContent = 'Only letters please!';
      el.addWordError.hidden = false;
      return;
    }
    R.replaceCurrentWord(game, word);
    closeAddWordModal();
    startWord();
  }

  /* ---------- input ---------- */

  function begin() {
    fx.ctx(); // unlock audio inside the user gesture
    el.startOverlay.hidden = true;
    game = R.createGame({ words: theme.words, celebrations: theme.celebrations });
    phase = 'playing';
    startWord();
  }

  function onKeyDown(e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    if (phase === 'start') { begin(); return; }
    if (phase !== 'playing') return;
    // without preventDefault the same keystroke lands in the input we just focused
    if (e.key === '+') { e.preventDefault(); openAddWordModal(); return; }
    const ev = R.inputLetter(game, e.key);
    if (ev.type === 'correct') handleCorrect(ev);
    else if (ev.type === 'incorrect') handleIncorrect(ev);
    else if (ev.type === 'word-complete') handleWordComplete(ev);
  }

  /* ---------- a small helper themes use for timed steps inside a scene ---------- */

  function steps(pairs) {
    const timers = pairs.map(([ms, fn]) => setTimeout(fn, ms));
    return () => timers.forEach(clearTimeout);
  }

  function boot(themeSpec) {
    theme = themeSpec;
    el.tiles = document.getElementById('tiles');
    el.hint = document.getElementById('hint');
    el.startOverlay = document.getElementById('start-overlay');
    el.celebration = document.getElementById('celebration');
    el.celebrationWord = document.getElementById('celebration-word');
    el.celebrationCaption = document.getElementById('celebration-caption');
    const tray = document.getElementById('tray');
    if (tray) fx.useTray(tray);

    buildChrome();
    document.addEventListener('keydown', onKeyDown);
    el.startOverlay.addEventListener('click', () => { if (phase === 'start') begin(); });
    if (theme.onReady) theme.onReady();
  }

  window.SpellEngine = { boot, steps, fx, get phase() { return phase; } };
})();
</script>
<script>
/* Spellodrum — theme layer: art hookups, sound design, celebration choreography.
   Shared rules and shell live in ../../engine/. */
(function () {
  'use strict';

  const E = window.SpellEngine;
  const fx = window.SpellFx;

  // One drummer rig, copied into every <g class="greg"> on the page (main scene, start
  // screen, celebrations), so there's a single drawing of Greg and his kit to maintain.
  const rig = document.getElementById('greg-rig');
  for (const slot of document.querySelectorAll('g.greg')) {
    for (const part of rig.children) slot.appendChild(part.cloneNode(true));
  }

  const greg = document.getElementById('greg');
  const snareAnchor = greg.querySelector('.snare-anchor');
  const MOODS = ['happy', 'oops'];
  const HITS = ['hit-l', 'hit-r', 'dropped-l', 'dropped-r'];

  // correct-letter markers: drumsticks, cymbals and drums, piling up in the tray
  const MARKERS = ['mk-sticks', 'mk-cymbal', 'mk-drum'];
  const MARKER_BOX = '-28 -28 56 56';

  /* ---------- sound design: a synthesised drum kit ---------- */

  function kick(startIn, peak) {
    fx.sweep(150, 42, 0.36, 'sine', peak || 0.5, startIn || 0);
    fx.noise(0.02, startIn || 0, 0.08, 3000, 'bandpass');
  }

  function snare(startIn, peak) {
    const t = startIn || 0;
    fx.noise(0.2, t, peak || 0.28, 1900, 'bandpass');
    fx.noise(0.12, t, (peak || 0.28) * 0.5, 5000, 'highpass');
    fx.tone(196, t, 0.1, 'triangle', 0.16);
  }

  function hat(startIn, peak) {
    fx.noise(0.05, startIn || 0, peak || 0.12, 8000, 'highpass');
  }

  // cymbals are a cluster of out-of-tune partials plus a hiss
  function ride(startIn) {
    const t = startIn || 0;
    [2960, 3730, 5210].forEach((f) => fx.tone(f, t, 0.7, 'sine', 0.025));
    fx.noise(0.5, t, 0.07, 7000, 'highpass');
  }

  function crash(startIn) {
    const t = startIn || 0;
    fx.noise(1.8, t, 0.26, 5200, 'highpass');
    fx.noise(1.2, t, 0.12, 2600, 'bandpass');
    [1830, 2710, 3940].forEach((f) => fx.tone(f, t, 1.4, 'sine', 0.02));
  }

  function tom(freq, startIn, peak) {
    fx.sweep(freq, freq * 0.62, 0.34, 'sine', peak || 0.36, startIn || 0);
    fx.noise(0.04, startIn || 0, 0.06, 1400, 'bandpass');
  }

  // Correct letter: a real drum hit, with a tom that climbs through the word.
  const TOMS = [98, 110, 123.5, 138.6, 155.6, 174.6, 196, 220, 246.9, 277.2];
  function hitSound(index, side) {
    kick(0, 0.42);
    tom(TOMS[Math.min(index, TOMS.length - 1)] * 1.5, 0.01, 0.3);
    if (side === 'hit-l') snare(0.01);
    else ride(0.01);
  }

  // Wrong letter: a stick bouncing on the floor — tick... tick.. tick.tick — and a daft "boing".
  function clatter() {
    fx.sweep(520, 160, 0.3, 'triangle', 0.08);
    [0.38, 0.56, 0.68, 0.76, 0.82].forEach((t, i) => {
      fx.tone(1760 - i * 90, t, 0.06, 'square', 0.05 - i * 0.007);
      fx.noise(0.03, t, 0.08 - i * 0.012, 3400, 'bandpass');
    });
  }

  function cheer(dur, startIn) {
    fx.noise(dur, startIn || 0, 0.12, 1100, 'bandpass');
    fx.noise(dur * 0.8, (startIn || 0) + 0.1, 0.06, 2600, 'bandpass');
  }

  function crunch(startIn) {
    [0, 0.07, 0.13].forEach((t) => fx.noise(0.05, (startIn || 0) + t, 0.14, 2200 + t * 4000, 'bandpass'));
  }

  function click(startIn, accent) {
    fx.tone(accent ? 1760 : 1320, startIn || 0, 0.04, 'square', 0.06);
  }

  function honk(startIn) {
    fx.tone(349.2, startIn || 0, 0.18, 'sawtooth', 0.07);
    fx.tone(440, startIn || 0, 0.18, 'sawtooth', 0.05);
  }

  function fanfare() {
    kick(0);
    crash(0.02);
    [261.63, 329.63, 392.0, 523.25].forEach((f, i) => {
      fx.tone(f, 0.1 + i * 0.1, 0.3, 'square', 0.05);
    });
  }

  /* A groove on a fixed beat: pattern letters are k (kick), s (snare), h (hat),
     r (ride), t (a tom, climbing), c (crash), and '.' for a rest. */
  function groove(pattern, beatMs, fromMs, untilMs) {
    const steps = [];
    let i = 0;
    for (let t = fromMs; t < untilMs; t += beatMs, i++) {
      const hits = pattern[i % pattern.length];
      steps.push([t, () => {
        for (const h of hits) {
          if (h === 'k') kick();
          else if (h === 's') snare();
          else if (h === 'h') hat();
          else if (h === 'r') ride();
          else if (h === 'c') crash();
          else if (h === 't') tom(TOMS[i % TOMS.length] * 1.2);
        }
      }]);
    }
    return steps;
  }

  /* ---------- the main-scene hit and drop (restart the CSS animation each time) ---------- */

  let hitTimer = null;
  function play(cls, ms) {
    clearTimeout(hitTimer);
    for (const c of HITS) greg.classList.remove(c);
    // a reflow, or re-adding the same class in the same frame wouldn't restart it
    void greg.getBoundingClientRect();
    greg.classList.add(cls);
    hitTimer = setTimeout(() => greg.classList.remove(cls), ms);
  }

  /* ---------- celebrations ---------- */

  // Each scene's Greg drums on a --beat set in the markup; the sound follows the same beat.
  const scenes = {
    fast: {
      caption: 'Greg plays fast!',
      duration: 6400,
      start() {
        return E.steps(groove(['kh', 'sh', 'kh', 'sh', 'kh', 'sh', 'kh', 'skh'], 160, 300, 5800));
      },
    },

    slow: {
      caption: 'Greg plays slow...',
      duration: 6800,
      start() {
        return E.steps(groove(['kr', 's'], 1200, 400, 6400));
      },
    },

    rocknroll: {
      caption: 'Rock & roll finish!',
      duration: 7000,
      // a roll that builds for 3.4s, then everything at once and the sticks go up
      start(scene) {
        const g = scene.querySelector('.greg');
        const roll = [];
        for (let i = 0; i < 24; i++) {
          roll.push([i * 140, () => { snare(0, 0.12 + i * 0.008); if (i % 2 === 0) kick(0, 0.3); }]);
        }
        const cancel = E.steps(roll.concat([
          [3400, () => { crash(); kick(0, 0.6); tom(80, 0, 0.5); g.classList.add('finished'); }],
          [3500, () => cheer(2.2)],
          [4300, () => crash()],
        ]));
        return () => { cancel(); g.classList.remove('finished'); };
      },
    },

    solo: {
      caption: 'Greg plays a drum solo!',
      duration: 6600,
      start() {
        return E.steps(groove(['kt', 't', 'st', 't', 'kt', 't', 'krt', 's'], 260, 300, 6100));
      },
    },

    practice: {
      caption: 'Greg practices hard!',
      duration: 6600,
      // the metronome ticks every 0.5s, and Greg is exactly on it
      start() {
        const ticks = [];
        for (let t = 0, i = 0; t < 6200; t += 500, i++) ticks.push([t + 250, () => click(0, i % 4 === 0)]);
        return E.steps(ticks.concat(groove(['k', 's', 'k', 'ks'], 500, 250, 6200)));
      },
    },

    tour: {
      caption: 'Greg goes on tour with his band!',
      duration: 7000,
      start() {
        return E.steps([
          [100, () => fx.sweep(70, 110, 1.8, 'sawtooth', 0.05)],        // the van pulling in
          [1900, () => honk(0)],
          [2150, () => honk(0)],
          ...groove(['k', 'h', 's', 'h'], 300, 2400, 5400),
          [5400, () => fx.sweep(90, 160, 1.4, 'sawtooth', 0.05)],        // and off again
          [5600, () => honk(0)],
        ]);
      },
    },

    sinclair: {
      caption: 'Greg plays a sold-out show at The Sinclair!',
      duration: 7200,
      start() {
        return E.steps([
          [200, () => cheer(1.6)],
          ...groove(['kr', 's', 'kr', 's', 'kkr', 's', 'kr', 'sc'], 300, 500, 6600),
          [3600, () => cheer(2.4)],
        ]);
      },
    },

    cereal: {
      caption: 'Greg eats a lot of cereal!',
      duration: 7000,
      // every hit bounces an O out of the bowl; it lands in his mouth half a beat later
      start() {
        const steps = groove(['k', 's'], 500, 250, 6400);
        for (let t = 250 + 810; t < 6400; t += 500) steps.push([t, () => crunch()]);
        return E.steps(steps);
      },
    },
  };

  let side = 'hit-r';

  E.boot({
    name: 'Spellodrum',
    hint: 'Help Greg spell it!',
    addWordLabel: 'Add a word for Greg to spell:',

    words: window.SpellWords.WORDS,
    celebrations: window.SpellWords.CELEBRATIONS,
    scenes,

    // every letter is a hit, left hand then right, so a word is a little drum fill
    onCorrect({ tileEl, index }) {
      side = side === 'hit-l' ? 'hit-r' : 'hit-l';
      hitSound(index, side);
      play(side, 460);
      fx.mood(greg, null, 0, MOODS);
      const marker = fx.rand(MARKERS);
      fx.flyTo({
        proto: marker,
        size: 76,
        viewBox: MARKER_BOX,
        fromEl: tileEl,
        toEl: snareAnchor,
        spin: 300,
        onArrive() { fx.addToTray(marker, MARKER_BOX); },
      });
    },

    // oops — he drops a stick, and grabs a new one
    onIncorrect() {
      clatter();
      play(fx.rand(['dropped-l', 'dropped-r']), 1150);
      fx.mood(greg, 'oops', 1100, MOODS);
    },

    onWordComplete() {
      fanfare();
      fx.mood(greg, 'happy', 900, MOODS);
    },
  });
})();
</script>
</body>
