<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellworms</title>
<style>
/*
 * Theme-free layout for the spelling-game shell: letter tiles, overlays, the add-a-word
 * modal, flying sprites, the tray and the mute button.
 *
 * Themes set the palette by overriding these custom properties, and own everything else
 * (backgrounds, art, celebration choreography).
 */

:root {
  --ink: #f3efe0;          /* body text */
  --ink-dim: rgba(243, 239, 224, 0.6);
  --accent: #ffd166;       /* highlights: done tiles, headings */
  --accent-edge: #f4a93c;
  --accent-ink: #5b3a26;   /* text on top of --accent */
  --overlay-bg: rgba(13, 19, 48, 0.96);
  --panel-bg: rgba(13, 19, 48, 0.97);
  --hairline: rgba(243, 239, 224, 0.3);
  --tile-bg: rgba(255, 255, 255, 0.08);
  --tile-ink: rgba(243, 239, 224, 0.32);   /* letter not yet typed */
  --tile-edge: rgba(243, 239, 224, 0.25);  /* its dashed outline */
  --hint-ink: var(--ink-dim);
  --chrome-ink: var(--ink);                /* the mute button, over the play area */
  --error: #ff6b6b;
  --game-font: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "Trebuchet MS", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--game-font);
  color: var(--ink);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  max-width: 1100px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

/* ---------- word tiles ---------- */

#word-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;
}

#tiles {
  --n: 5;
  --gap: clamp(4px, 1vw, 16px);
  display: flex;
  justify-content: center;
  gap: var(--gap);
}

/* Tiles are as big as they can be while the whole word still fits on one line. */
.tile {
  --tile-w: min(
    clamp(30px, 10vw, 92px),
    calc((min(100vw - 32px, 1100px) - (var(--n) - 1) * var(--gap)) / var(--n))
  );
  width: var(--tile-w);
  height: calc(var(--tile-w) * 1.19);
  font-size: calc(var(--tile-w) * 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: var(--tile-ink);
  background: var(--tile-bg);
  border: 3px dashed var(--tile-edge);
  border-radius: clamp(6px, calc(var(--tile-w) * 0.18), 16px);
}

.tile.done {
  color: var(--accent-ink);
  background: var(--accent);
  border: 3px solid var(--accent-edge);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  animation: tile-pop 0.45s ease-out;
}

@keyframes tile-pop {
  0% { transform: scale(0.6) rotate(-6deg); }
  55% { transform: scale(1.22) rotate(3deg); }
  100% { transform: scale(1) rotate(0); }
}

#hint {
  font-size: clamp(15px, 2.4vw, 21px);
  color: var(--hint-ink);
  letter-spacing: 0.06em;
  min-height: 1.4em;
  text-align: center;
}

/* ---------- collection tray ---------- */

#tray {
  position: fixed;
  left: 14px;
  bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  max-width: 280px;
  align-items: flex-end;
}
#tray svg {
  width: 42px;
  height: 42px;
  animation: tray-drop 0.4s ease-out;
}
@keyframes tray-drop {
  from { transform: translateY(-22px) scale(0.4); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

/* ---------- flying / crawling sprites ---------- */

.sprite {
  position: fixed;
  pointer-events: none;
  z-index: 40;
}
.sprite svg { display: block; }

/* ---------- mute button ---------- */

#mute {
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 60;
  font-size: 22px;
  line-height: 1;
  padding: 8px 10px;
  border-radius: 12px;
  border: 2px solid var(--chrome-hairline, var(--hairline));
  background: var(--chrome-bg, var(--tile-bg));
  color: var(--chrome-ink);
  cursor: pointer;
}

/* ---------- overlays ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--overlay-bg);
  text-align: center;
  padding: 24px;
}
.overlay[hidden] { display: none; }

#start-overlay h1 {
  margin: 0;
  font-size: clamp(40px, 8.5vw, 96px);
  letter-spacing: 0.08em;
  color: var(--accent);
  text-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
}
#start-overlay .subtitle {
  margin: 0;
  font-size: clamp(16px, 2.6vw, 24px);
  color: var(--ink);
  opacity: 0.8;
}
#start-overlay .press {
  margin-top: 18px;
  font-size: clamp(18px, 3vw, 28px);
  color: var(--ink);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

/* ---------- celebration overlay ---------- */

#celebration .scene {
  width: min(92vw, 760px);
  height: auto;
}
#celebration .scene[hidden] { display: none; }

#celebration-caption {
  font-size: clamp(20px, 3.6vw, 38px);
  color: var(--accent);
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  min-height: 1.4em;
}
#celebration-word {
  font-size: clamp(22px, 4.4vw, 54px);
  letter-spacing: 0.2em;
  color: var(--ink);
}

/* every celebration sprite is positioned purely via CSS transforms */
#celebration use, #celebration .cb { transform-box: view-box; }

/* ---------- add-a-word modal ---------- */

#add-word-modal { z-index: 70; }

#add-word-card {
  background: var(--panel-bg);
  border: 2px solid var(--hairline);
  border-radius: 20px;
  padding: 32px 36px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: min(480px, 90vw);
  text-align: center;
}

#add-word-card label {
  font-size: clamp(16px, 2.4vw, 22px);
  color: var(--ink);
}

#add-word-input {
  font-family: inherit;
  font-size: clamp(24px, 5vw, 44px);
  font-weight: bold;
  letter-spacing: 0.12em;
  text-align: center;
  text-transform: uppercase;
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid var(--hairline);
  background: var(--tile-bg);
  color: var(--accent);
  outline: none;
  width: 100%;
}
#add-word-input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.12);
}

#add-word-error {
  font-size: clamp(13px, 1.8vw, 16px);
  color: var(--error);
  min-height: 1.2em;
}

#add-word-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

#add-word-buttons button {
  font-family: inherit;
  font-size: clamp(15px, 2vw, 19px);
  padding: 10px 22px;
  border-radius: 12px;
  border: 2px solid var(--hairline);
  cursor: pointer;
}

#add-word-confirm {
  background: rgba(255, 209, 102, 0.18);
  color: var(--accent);
}
#add-word-confirm:hover { background: rgba(255, 209, 102, 0.3); }

#add-word-cancel {
  background: rgba(255, 255, 255, 0.06);
  color: var(--ink-dim);
}
#add-word-cancel:hover { background: rgba(255, 255, 255, 0.12); }
</style>
<style>
/* Spellworms — a hydrothermal vent, two and a half kilometres down.
   Layout, tiles, overlays and the add-a-word modal live in ../../engine/engine.css. */

:root {
  /* the whole game is dark, so the engine's default (dark) chrome works as-is */
  --ink: #e8f2f8;
  --ink-dim: rgba(232, 242, 248, 0.64);
  --accent: #ffc45c;            /* the colour of hot mineral-rich water */
  --accent-edge: #e8912a;
  --accent-ink: #3a2408;
  --overlay-bg: rgba(4, 20, 34, 0.97);
  --panel-bg: rgba(4, 20, 34, 0.98);
  --hairline: rgba(232, 242, 248, 0.28);
  --tile-bg: rgba(159, 216, 238, 0.09);
  --tile-ink: rgba(232, 242, 248, 0.3);
  --tile-edge: rgba(159, 216, 238, 0.28);

  /* how tall the vent field is — the dark water below it starts exactly here */
  --scene-h: min(52vh, 44vw);

  /* Spellworm's colours (the colony worms dim these down) */
  --tube: #f3eee2;
  --tube-shade: #cdc3b0;
  --tube-rim: #b3a893;
  --tube-foot: #59473a;
  --frond: #d6392f;
  --frond-lite: #ff7a63;
}

body {
  background:
    linear-gradient(180deg, #08354f 0%, #041d31 55%, #020d17 100%)
      no-repeat 0 0 / 100% var(--scene-h),
    linear-gradient(180deg, #0d1620 0%, #04101a 100%)
      no-repeat 0 var(--scene-h) / 100% 100%;
}

/* ---------- main scene ---------- */

/* Edge to edge, like Spellasaurus: "slice" crops ~58 viewBox units off the top on a
   wide window, so nothing important lives above y ≈ 60. */
#scene {
  display: block;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  height: var(--scene-h);
}

/* ---------- the tube-worm rig ----------
   Two pieces in a <g class="worm">: the plume pivots at the tube's rim, and is drawn
   BEFORE the tube so the tube hides it when it ducks. The anchor marking the mouth
   carries exactly the same transform and animation so treats keep hitting the face. */

.worm .plume, .worm .plume-anchor { transform: translate(0px, -202px); }
.worm .plume, .worm .tube, .worm .plume-anchor { transform-box: view-box; }
#scene .worm, #start-worm .worm { transform-box: view-box; }

/* Face control — these custom properties cascade into the <use> shadow tree.
   A plume with no .worm-face shows no face at all, which is what the colony wants. */
.worm-face {
  --eyes-open: block;
  --eyes-happy: none;
  --mouth-smile: block;
  --mouth-munch: none;
  --mouth-yuck: none;
}
.worm-face.happy {
  --eyes-open: none;
  --eyes-happy: block;
}
.worm-face.munching {
  --eyes-open: none;
  --eyes-happy: block;
  --mouth-smile: none;
  --mouth-munch: block;
}
.worm-face.yucking {
  --mouth-smile: none;
  --mouth-yuck: block;
}

@keyframes sway {
  from { transform: translate(0px, -202px) rotate(-5deg); }
  to   { transform: translate(0px, -202px) rotate(5deg); }
}
/* a mineral arrives and she chews it */
@keyframes chew {
  0%, 100% { transform: translate(0px, -202px) scale(1); }
  50%      { transform: translate(0px, -202px) scale(1.07, 0.93); }
}
/* wrong letter: the vent stops, and she pulls down inside her tube for a moment */
@keyframes duck {
  0%   { transform: translate(0px, -202px) scale(1); }
  20%  { transform: translate(0px, -166px) scale(0.5); }
  64%  { transform: translate(0px, -166px) scale(0.5); }
  100% { transform: translate(0px, -202px) scale(1); }
}

#scene .worm .plume, #scene .worm .plume-anchor,
#start-worm .worm .plume {
  animation: sway 4.6s ease-in-out infinite alternate;
}
/* the colony breathes out of step with itself */
#scene .colony .worm:nth-of-type(2n) .plume { animation-duration: 5.6s; animation-delay: -1.4s; }
#scene .colony .worm:nth-of-type(3n) .plume { animation-duration: 3.9s; animation-delay: -2.6s; }
#scene .colony .worm:nth-of-type(5n) .plume { animation-duration: 6.2s; animation-delay: -0.7s; }

#scene .hero .plume.munching { animation: chew 0.24s ease-in-out 4; }
#scene .hero .plume.yucking,
#scene .hero .plume-anchor.ducking { animation: duck 1.1s ease-in-out; }

/* Spellworm, and the ten neighbours crowding round the vent */
#scene .hero { transform: translate(418px, 378px) scale(0.88); }
#scene .colony .w1  { transform: translate(600px, 368px) scale(0.52) rotate(-3deg); }
#scene .colony .w2  { transform: translate(648px, 374px) scale(0.40) rotate(5deg); }
#scene .colony .w3  { transform: translate(830px, 370px) scale(0.50) rotate(4deg); }
#scene .colony .w4  { transform: translate(874px, 376px) scale(0.38) rotate(-5deg); }
#scene .colony .w5  { transform: translate(912px, 368px) scale(0.30) rotate(7deg); }
#scene .colony .w6  { transform: translate(688px, 384px) scale(0.26) rotate(-6deg); }
#scene .colony .w7  { transform: translate(176px, 367px) scale(0.50) rotate(-4deg); }
#scene .colony .w8  { transform: translate(234px, 374px) scale(0.36) rotate(6deg); }
#scene .colony .w9  { transform: translate(124px, 378px) scale(0.30) rotate(7deg); }
#scene .colony .w10 { transform: translate(302px, 370px) scale(0.44) rotate(-6deg); }

/* the neighbours sit further back in the gloom */
#scene .colony .worm {
  --tube: #cfcabe;
  --tube-shade: #a49b8b;
  --tube-rim: #8d8474;
  --frond: #a32b26;
  --frond-lite: #d4594a;
  opacity: 0.88;
}

/* ---------- the black smoker ---------- */

/* The chimney's transform lives in CSS, not in the markup, so the "cough" keyframes
   can carry the full transform without the two fighting (CSS replaces the attribute). */
#vent-stack .chimney { transform: translate(736px, 368px) scale(1); }
#vent-stack .chimney, #vent-stack .puff, #vent-stack .grit { transform-box: view-box; }

#vent-stack .puff {
  opacity: 0;
  animation: puff-rise 4.2s linear infinite;
  animation-delay: calc(var(--i) * -0.7s);
}
@keyframes puff-rise {
  0%   { transform: translate(713px, 158px) scale(0.28); opacity: 0; }
  14%  { opacity: 0.9; }
  70%  { opacity: 0.55; }
  100% { transform: translate(calc(713px + var(--dx)), -20px) scale(1.7); opacity: 0; }
}

/* flecks of sulfide riding up in the smoke — the minerals she is waiting for */
#vent-stack .grit {
  opacity: 0;
  fill: #ffd98a;
  animation: grit-rise 3.4s linear infinite;
  animation-delay: calc(var(--i) * -0.85s);
}
@keyframes grit-rise {
  0%   { transform: translate(713px, 160px) scale(0.2); opacity: 0; }
  18%  { opacity: 0.95; }
  100% { transform: translate(calc(713px + var(--dx)), 52px) scale(0.5); opacity: 0; }
}

/* a wrong letter makes the vent hiccup: the plume stops dead for a second */
#vent-stack.stalled .puff, #vent-stack.stalled .grit { animation: none; opacity: 0; }
#vent-stack.stalled .chimney { animation: cough 0.7s ease-in-out; }
@keyframes cough {
  0%, 100% { transform: translate(736px, 368px) scale(1); }
  35%      { transform: translate(736px, 370px) scale(1.04, 0.97); }
  70%      { transform: translate(736px, 369px) scale(0.98, 1.02); }
}

/* ---------- marine snow ---------- */

#scene .flake {
  opacity: 0;
  mix-blend-mode: screen;
  animation: drift 15s linear infinite;
  animation-delay: calc(var(--i) * -0.95s);
}
@keyframes drift {
  0%   { transform: translate(0, -60px); opacity: 0; }
  12%  { opacity: 0.3; }
  85%  { opacity: 0.22; }
  100% { transform: translate(-26px, 240px); opacity: 0; }
}

/* ---------- start overlay art ---------- */

#start-worm { width: clamp(220px, 46vw, 430px); }

/* ---------- shared celebration scenery ---------- */

#celebration .scene .floor { fill: #15202d; }
#celebration .worm, #celebration .crab-wrap, #celebration .octo-wrap,
#celebration .sub-wrap, #celebration .pod-wrap, #celebration .pw,
#celebration .blast { transform-box: view-box; }

#celebration .cb-heart, #celebration .cb-star, #celebration .cb-bubble,
#celebration .cb-gem, #celebration .spark, #celebration .bpuff { opacity: 0; }

#celebration .cb-bubble { stroke: #bfe8ff; }

@keyframes heart-float {
  0%   { opacity: 0; translate: 0 0; scale: 0.4; }
  20%  { opacity: 1; scale: 1.1; }
  100% { opacity: 0; translate: 0 -130px; scale: 1; }
}
@keyframes star-pop {
  0%   { opacity: 0; scale: 0.2; rotate: -40deg; }
  35%  { opacity: 1; scale: 1.25; rotate: 10deg; }
  70%  { opacity: 1; scale: 1; rotate: 0deg; }
  100% { opacity: 0; scale: 0.8; }
}
/* bubbles wobble as they go up, the way they actually do */
@keyframes bubble-rise {
  0%   { opacity: 0; translate: 0 0; scale: 0.5; }
  15%  { opacity: 0.85; }
  40%  { translate: 14px -90px; }
  70%  { translate: -10px -190px; }
  100% { opacity: 0; translate: 8px -280px; scale: 1.2; }
}

/* A radial burst: each sprite sits at a shared centre (--px,--py) and is thrown out
   along its own angle (--a) for its own distance (--d) — one @keyframes, many sprites. */
@keyframes burst {
  0% {
    transform: translate(var(--px), var(--py)) rotate(var(--a)) translate(0, 0) scale(0.25);
    opacity: 0;
  }
  12% { opacity: 1; }
  70% { opacity: 1; }
  100% {
    transform: translate(var(--px), var(--py)) rotate(var(--a))
               translate(0, calc(-1 * var(--d))) scale(1.05);
    opacity: 0;
  }
}

/* the host worm leans towards whoever has come to visit */
@keyframes lean-right {
  from { transform: translate(0px, -202px) rotate(0deg); }
  to   { transform: translate(0px, -202px) rotate(36deg); }
}
@keyframes lean-left {
  from { transform: translate(0px, -202px) rotate(0deg); }
  to   { transform: translate(0px, -202px) rotate(-36deg); }
}

/* --- happy: a ghost crab comes to say hello --- */

#scene-crab .host { transform: translate(232px, 472px) scale(1); }
#scene-crab .crab-wrap { transform: translate(900px, 470px) scale(-1.4, 1.4); }

/* it scuttles in sideways, the way crabs do, bobbing on every other step */
#scene-crab.playing .crab-wrap { animation: crab-in 2.4s ease-out 0.3s forwards; }
@keyframes crab-in {
  0%   { transform: translate(900px, 470px) scale(-1.4, 1.4); }
  16%  { transform: translate(816px, 458px) scale(-1.4, 1.4); }
  32%  { transform: translate(732px, 470px) scale(-1.4, 1.4); }
  48%  { transform: translate(648px, 458px) scale(-1.4, 1.4); }
  64%  { transform: translate(564px, 470px) scale(-1.4, 1.4); }
  80%  { transform: translate(490px, 458px) scale(-1.4, 1.4); }
  92%  { transform: translate(436px, 470px) scale(-1.4, 1.4); }
  100% { transform: translate(428px, 466px) scale(-1.4, 1.4); }
}
#scene-crab.playing .host .plume { animation: lean-right 1.1s ease-in-out 2.5s forwards; }

#scene-crab.playing .cb-heart { animation: heart-float 2s ease-out forwards; }
#scene-crab.playing .cb-heart.h1 { transform: translate(300px, 300px) scale(1.4); animation-delay: 3.1s; }
#scene-crab.playing .cb-heart.h2 { transform: translate(370px, 274px) scale(1.9); animation-delay: 3.45s; }
#scene-crab.playing .cb-heart.h3 { transform: translate(244px, 262px) scale(1.5); animation-delay: 3.8s; }
#scene-crab.playing .cb-heart.h4 { transform: translate(430px, 290px) scale(1.6); animation-delay: 4.15s; }
#scene-crab.playing .cb-bubble { animation: bubble-rise 3.4s ease-in-out infinite; }
#scene-crab.playing .cb-bubble.b1 { transform: translate(650px, 430px) scale(1.6); animation-delay: 0.2s; }
#scene-crab.playing .cb-bubble.b2 { transform: translate(718px, 446px) scale(1.1); animation-delay: 1.3s; }
#scene-crab.playing .cb-bubble.b3 { transform: translate(96px, 430px) scale(2); animation-delay: 2.1s; }

/* --- happy: a dumbo octopus flaps past --- */

#scene-octopus .host { transform: translate(180px, 472px) scale(0.95); }
#scene-octopus .octo-wrap { transform: translate(-200px, 320px) scale(0.8); }

#scene-octopus.playing .octo-wrap { animation: octo-swim 5.6s ease-in-out 0.3s forwards; }
@keyframes octo-swim {
  0%   { transform: translate(-200px, 316px) scale(0.72) rotate(0deg); }
  22%  { transform: translate(180px, 252px) scale(0.84) rotate(-7deg); }
  42%  { transform: translate(370px, 322px) scale(0.92) rotate(9deg); }
  60%  { transform: translate(540px, 246px) scale(0.86) rotate(-9deg); }
  80%  { transform: translate(720px, 296px) scale(0.76) rotate(5deg); }
  100% { transform: translate(1010px, 224px) scale(0.64) rotate(-4deg); }
}
/* her plume follows it all the way across */
#scene-octopus.playing .host .plume { animation: watch-across 5.6s ease-in-out 0.3s forwards; }
@keyframes watch-across {
  0%   { transform: translate(0px, -202px) rotate(-22deg); }
  30%  { transform: translate(0px, -202px) rotate(-4deg); }
  70%  { transform: translate(0px, -202px) rotate(22deg); }
  100% { transform: translate(0px, -202px) rotate(34deg); }
}

#scene-octopus.playing .cb-bubble { animation: bubble-rise 3.6s ease-in-out infinite; }
#scene-octopus.playing .cb-bubble.b1 { transform: translate(120px, 440px) scale(1.7); animation-delay: 0.3s; }
#scene-octopus.playing .cb-bubble.b2 { transform: translate(330px, 450px) scale(1.1); animation-delay: 1.1s; }
#scene-octopus.playing .cb-bubble.b3 { transform: translate(520px, 442px) scale(2); animation-delay: 1.9s; }
#scene-octopus.playing .cb-bubble.b4 { transform: translate(680px, 452px) scale(1.3); animation-delay: 2.6s; }
#scene-octopus.playing .cb-bubble.b5 { transform: translate(420px, 446px) scale(1.8); animation-delay: 3.3s; }
#scene-octopus.playing .cb-star { animation: star-pop 1.6s ease-out forwards; }
#scene-octopus.playing .cb-star.s1 { transform: translate(300px, 210px) scale(1.2); animation-delay: 3.4s; }

<body>

<!-- ======= shared art (referenced everywhere via <use>) =======
     A giant tube worm is drawn in two pieces so scenes can articulate it:
       #worm-tube   — the white tube, origin at the seafloor, opening at y = -202
       #worm-plume  — the red fronds and the face, pivot at the tube's RIM
     A scene places the pieces at this fixed local offset (see theme.css .worm):
       plume: translate(0, -202)
     The plume is drawn BEFORE the tube so the tube occludes it — that is what makes
     the startled duck read as the worm pulling down inside its tube.
     #worm-proto glues both together for static art. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <linearGradient id="water-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#08354f"/>
      <stop offset="0.5"  stop-color="#041d31"/>
      <stop offset="1"    stop-color="#020d17"/>
    </linearGradient>
    <radialGradient id="warm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodule-grad" cx="36%" cy="30%" r="76%">
      <stop offset="0"   stop-color="#6f7fa6"/>
      <stop offset="0.5" stop-color="#3a3a58"/>
      <stop offset="1"   stop-color="#191a2c"/>
    </radialGradient>

    <!-- ---------- the giant tube worm ---------- -->

    <!-- One frond, base at the origin, growing straight up. A pointed blade with a
         fringe of barbs drawn BEHIND it, so only the barb tips show past the silhouette
         and the whole thing reads as a feather rather than a spike. -->
    <g id="frond-blade">
      <g stroke="var(--frond, #d6392f)" stroke-width="3.6" stroke-linecap="round">
        <path d="M 0,-80 L -10,-71 M 0,-80 L 10,-71"/>
        <path d="M 0,-66 L -14,-56 M 0,-66 L 14,-56"/>
        <path d="M 0,-52 L -16,-42 M 0,-52 L 16,-42"/>
        <path d="M 0,-38 L -17,-28 M 0,-38 L 17,-28"/>
        <path d="M 0,-24 L -16,-14 M 0,-24 L 16,-14"/>
        <path d="M 0,-10 L -14,-1  M 0,-10 L 14,-1"/>
      </g>
      <path d="M -8,2 C -12,-30 -10,-62 0,-92 C 10,-62 12,-30 8,2 Z" fill="var(--frond, #d6392f)"/>
      <path d="M 0,-84 L 0,0" stroke="var(--frond-lite, #ff7a63)" stroke-width="2.6"
        stroke-linecap="round" opacity="0.68"/>

<script>
/*
 * Spelling-game rules — pure, no DOM, no theme.
 *
 * Every themed game (Spellaluna, Spellasaurus, ...) shares this: a shuffled word queue
 * with no immediate repeats, letter-by-letter matching, and a celebration picked after
 * each finished word.
 *
 * UMD-ish: usable as a classic <script> (window.SpellRules) and via require() in tests.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.SpellRules = api;
  }
})(typeof self !== 'undefined' ? self : this, function () {

  function shuffle(arr, rng) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function pickFrom(list, rng) {
    return list[Math.min(Math.floor(rng() * list.length), list.length - 1)];
  }

  /*
   * createGame({ words, rng, celebrations })
   *
   * celebrations describes how the reward after each word is chosen:
   *   pool:   celebration names to draw from
   *   pick:   'cycle'  — walk the pool in order (1st word, 2nd word, ...)
   *           'random' — pick at random, never the same one twice in a row
   *   finale: { name, every } — optional; replaces the pool pick on every Nth word
   */
  function createGame(opts) {
    opts = opts || {};
    const allWords = (opts.words || []).slice();
    if (!allWords.length) throw new Error('createGame needs a non-empty words list');
    const rng = opts.rng || Math.random;
    const cel = opts.celebrations || {};
    const finale = cel.finale && cel.finale.name
      ? { name: cel.finale.name, every: cel.finale.every || 3 }
      : null;
    return {
      allWords,
      rng,
      celebrations: {
        pool: (cel.pool || []).slice(),
        pick: cel.pick === 'random' ? 'random' : 'cycle',
        finale,
      },
      queue: shuffle(allWords, rng),
      wordIndex: 0,
      letterIndex: 0,
      wordsCompleted: 0,
      poolPicks: 0,          // pool position; finales don't advance it
      lastCelebration: null,
    };
  }

  function getCurrentWord(game) {
    return game.queue[game.wordIndex];
  }

  function getLetterIndex(game) {
    return game.letterIndex;
  }

  /* Swap the word being spelled right now (the add-a-word feature). */
  function replaceCurrentWord(game, word) {
    game.queue[game.wordIndex] = word;
    game.letterIndex = 0;
    if (!game.allWords.includes(word)) game.allWords.push(word);
  }

  function advanceWord(game) {
    const lastWord = getCurrentWord(game);
    game.wordIndex++;
    game.letterIndex = 0;
    if (game.wordIndex >= game.queue.length) {
      const next = shuffle(game.allWords, game.rng);
      if (next.length > 1 && next[0] === lastWord) {
        [next[0], next[next.length - 1]] = [next[next.length - 1], next[0]];
      }
      game.queue = next;
      game.wordIndex = 0;
    }
  }

  /* Which reward plays now that `game.wordsCompleted` words are done. */
  function chooseCelebration(game) {
    const c = game.celebrations;
    const n = game.wordsCompleted;
    if (c.finale && n % c.finale.every === 0) {
      return { celebration: c.finale.name, finale: true };
    }
    if (!c.pool.length) return { celebration: null, finale: false };

    let name;
    if (c.pick === 'cycle') {
      name = c.pool[game.poolPicks % c.pool.length];
    } else {
      // never the same happy animation twice in a row — variety matters to a small human
      const choices = c.pool.length > 1
        ? c.pool.filter((x) => x !== game.lastCelebration)
        : c.pool;
      name = pickFrom(choices, game.rng);
    }
    game.poolPicks++;
    game.lastCelebration = name;
    return { celebration: name, finale: false };
  }

  /*
   * Feed one keypress into the game. Mutates `game` and returns an event:
   *   {type:'ignored'}
   *   {type:'incorrect', letter, expected}
   *   {type:'correct', letter, index}
   *   {type:'word-complete', word, letter, index, celebration, finale, wordsCompleted}
   * After 'word-complete' the game has already advanced to the next word.
   */
  function inputLetter(game, raw) {
    const letter = String(raw || '').toUpperCase();
    if (!/^[A-Z]$/.test(letter)) return { type: 'ignored' };

    const word = getCurrentWord(game);
    const expected = word[game.letterIndex];
    if (letter !== expected) {
      return { type: 'incorrect', letter, expected };
    }

    const index = game.letterIndex;
    game.letterIndex++;
    if (game.letterIndex >= word.length) {
      game.wordsCompleted++;
      const chosen = chooseCelebration(game);
      advanceWord(game);
      return {
        type: 'word-complete',
        word,
        letter,
        index,
        celebration: chosen.celebration,
        finale: chosen.finale,
        wordsCompleted: game.wordsCompleted,
      };
    }
    return { type: 'correct', letter, index };
  }

  return {
    createGame,
    getCurrentWord,
    getLetterIndex,
    replaceCurrentWord,
    inputLetter,
    shuffle,
  };
});
</script>
<script>
/*
 * Shared effects toolkit: Web Audio primitives, speech, and the sprite animations both
 * games use (a treat flying from a tile to the hero's mouth, a critter scurrying past).
 * Art is always supplied by the theme as an SVG <defs> id — this file never names one.
 *
 * Exposes window.SpellFx.
 */
(function () {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  let muted = false;
  let actx = null;
  let trayEl = null;

  /* ---------- sound ---------- */

  // Must be called from inside a user gesture the first time, or the context stays suspended.
  function ctx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, startIn, dur, type, peak) {
    const c = ctx();
    if (!c || muted) return;
    const t0 = c.currentTime + (startIn || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.18, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
    return osc;
  }

  /* A pitch slide — the raw material for bloops, rumbles and whooshes. */
  function sweep(from, to, dur, type, peak, startIn) {
    const c = ctx();
    if (!c || muted) return;
    const t0 = c.currentTime + (startIn || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(from, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t0 + dur * 0.85);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.2, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.07);
    return osc;
  }

  /* Filtered noise burst — splashes, thumps, tail cracks. */
  function noise(dur, startIn, peak, filterHz, filterType) {
    const c = ctx();
    if (!c || muted) return;
    const t0 = c.currentTime + (startIn || 0);
    const frames = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, frames, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const filter = c.createBiquadFilter();
    filter.type = filterType || 'bandpass';
    filter.frequency.setValueAtTime(filterHz || 1200, t0);
    const gain = c.createGain();
    gain.gain.setValueAtTime(peak || 0.18, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(gain).connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur);
  }

  /* ---------- speech ---------- */

  function say(text, opts) {
    opts = opts || {};
    if (muted || !window.speechSynthesis) return;
    if (opts.cancel !== false) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 0.9;
    u.pitch = opts.pitch || 1.15;
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  /* Letters and all-caps words are read as "capital B" / acronyms — always lowercase. */
  function sayWord(word, opts) {
    say(String(word).toLowerCase(), opts);
  }

  function setMuted(next) {
    muted = next;
    if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function isMuted() {
    return muted;
  }

  /* ---------- sprites ---------- */

  function sprite(protoId, size, viewBox) {
    const wrap = document.createElement('div');
    wrap.className = 'sprite';
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', viewBox || '-32 -32 64 64');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + protoId);
    svg.appendChild(use);
    wrap.appendChild(svg);
    document.body.appendChild(wrap);
    return wrap;
  }

  /*
   * Arc a treat from a letter tile up to the hero's mouth, then hand off to onArrive.
   * opts: { proto, size, fromEl, toEl, viewBox, duration, lift, spin, onArrive }
   */
  function flyTo(opts) {
    const size = opts.size || 84;
    const from = opts.fromEl.getBoundingClientRect();
    const to = opts.toEl.getBoundingClientRect();
    const s = sprite(opts.proto, size, opts.viewBox);
    const x0 = from.left + from.width / 2 - size / 2;
    const y0 = from.top - size / 2;
    s.style.left = x0 + 'px';
    s.style.top = y0 + 'px';
    const dx = to.left + to.width / 2 - size / 2 - x0;
    const dy = to.top + to.height / 2 - size / 2 - y0;
    const lift = opts.lift == null ? 90 : opts.lift;
    const spin = opts.spin == null ? 330 : opts.spin;

    const anim = s.animate(
      [
        { transform: 'translate(0px, 0px) scale(0.4) rotate(0deg)', opacity: 1 },
        {
          transform: `translate(${dx * 0.45}px, ${dy * 0.5 - lift}px) scale(1.1) rotate(${spin * 0.48}deg)`,
          opacity: 1,
          offset: 0.55,
        },
        { transform: `translate(${dx}px, ${dy}px) scale(0.45) rotate(${spin}deg)`, opacity: 0.9 },
      ],
      { duration: opts.duration || 800, easing: 'ease-in-out' }
    );
    anim.onfinish = () => {
      s.remove();
      if (opts.onArrive) opts.onArrive();
    };
    return s;
  }

  /* A critter wanders in under the tiles and scurries off one side. */
  function crawlPast(opts) {
    const size = opts.size || 120;
    const area = opts.areaEl.getBoundingClientRect();
    const x0 = area.left + area.width * (0.15 + Math.random() * 0.7);
    const y0 = area.bottom + (opts.drop == null ? 18 : opts.drop);
    const s = sprite(opts.proto, size, opts.viewBox);
    s.style.left = x0 + 'px';
    s.style.top = y0 + 'px';
    const dir = Math.random() < 0.5 ? -1 : 1;
    const dist = (window.innerWidth / 2 + size) * dir;
    const flip = dir < 0 ? ' scale(-1, 1)' : '';
    const wobble = opts.wobble == null ? 8 : opts.wobble;

    const anim = s.animate(
      [
        { transform: `translate(0,0) scale(0.2)${flip}`, opacity: 0 },
        { transform: `translate(${dist * 0.05}px, -6px)${flip}`, opacity: 1, offset: 0.15 },
        { transform: `translate(${dist * 0.3}px, 4px) rotate(${wobble * dir}deg)${flip}`, offset: 0.45 },
        { transform: `translate(${dist * 0.6}px, -4px) rotate(${-wobble * dir}deg)${flip}`, offset: 0.7 },
        { transform: `translate(${dist}px, 2px)${flip}`, opacity: 1 },
      ],
      { duration: opts.duration || 1700, easing: 'linear' }
    );
    anim.onfinish = () => s.remove();
    return s;
  }

  /* ---------- the collection tray (fruit eaten / leaves munched) ---------- */

  function useTray(el) {
    trayEl = el;
  }

  function addToTray(protoId, viewBox, max) {
    if (!trayEl) return;
    if (trayEl.children.length >= (max || 18)) trayEl.innerHTML = '';
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', viewBox || '-26 -30 52 56');
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + protoId);
    svg.appendChild(use);
    trayEl.appendChild(svg);
  }

  /* ---------- mood classes (a temporary face on a <use> element) ---------- */

  const moodTimers = new Map();

  function mood(el, cls, ms, siblings) {
    if (!el) return;
    for (const other of siblings || []) el.classList.remove(other);
    if (moodTimers.has(el)) clearTimeout(moodTimers.get(el));
    if (!cls) return;
    el.classList.add(cls);
    moodTimers.set(el, setTimeout(() => el.classList.remove(cls), ms));
  }

  function rand(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  window.SpellFx = {
    ctx, tone, sweep, noise,
    say, sayWord, setMuted, isMuted,
    sprite, flyTo, crawlPast,
    useTray, addToTray,
    mood, rand,
    SVG_NS,
  };
})();
</script>
<script>
/*
 * The game shell, shared by every theme.
 *
 * Owns: the phase machine, keyboard input, letter tiles, the celebration sequencer,
 * the add-a-word modal and the mute button. Knows nothing about bats, dinosaurs,
 * fruit or leaves — a theme supplies words, art, sounds and celebration scenes, and
 * calls SpellEngine.boot(theme) once its <script> has loaded.
 *
 * The theme's page must provide: #tiles, #hint, #start-overlay, #celebration,
 * #celebration-word, #celebration-caption, one #scene-<name> per celebration, and
 * optionally #tray. Everything else on the page is the theme's own art.
 */
(function () {
  'use strict';

  const R = window.SpellRules;
  const fx = window.SpellFx;

  let theme = null;
  let game = null;
  let phase = 'start'; // 'start' | 'playing' | 'celebrating' | 'adding-word'
  let sceneCleanup = null;
  let celebrationTimers = [];
  const el = {};

  /* ---------- chrome the engine owns outright ---------- */

  function buildChrome() {
    const mute = document.createElement('button');
    mute.id = 'mute';
    mute.setAttribute('aria-label', 'Toggle sound');
    mute.textContent = '🔊';
    mute.addEventListener('click', () => {
      fx.setMuted(!fx.isMuted());
      mute.textContent = fx.isMuted() ? '🔇' : '🔊';
    });
    document.body.appendChild(mute);

    const modal = document.createElement('div');
    modal.id = 'add-word-modal';
    modal.className = 'overlay';
    modal.hidden = true;
    modal.innerHTML = `
      <div id="add-word-card">
        <label for="add-word-input"></label>
        <input id="add-word-input" type="text" maxlength="20"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <div id="add-word-error" hidden></div>
        <div id="add-word-buttons">
          <button id="add-word-confirm">Add word</button>
          <button id="add-word-cancel">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(modal);

    el.addWordModal = modal;
    el.addWordLabel = modal.querySelector('label');
    el.addWordInput = modal.querySelector('#add-word-input');
    el.addWordError = modal.querySelector('#add-word-error');
    el.addWordLabel.textContent =
      theme.addWordLabel || `Add a word for ${theme.name || 'the game'} to spell:`;

    modal.querySelector('#add-word-confirm').addEventListener('click', confirmAddWord);
    modal.querySelector('#add-word-cancel').addEventListener('click', closeAddWordModal);
    el.addWordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  { e.preventDefault(); confirmAddWord(); }
      if (e.key === 'Escape') { e.preventDefault(); closeAddWordModal(); }
    });
  }

  /* ---------- words and tiles ---------- */

  function renderWord(word) {
    el.tiles.innerHTML = '';
    // tiles shrink to fit long words (TYRANNOSAURUS is 13 of them)
    el.tiles.style.setProperty('--n', word.length);
    for (const letter of word) {
      const tile = document.createElement('span');
      tile.className = 'tile';
      tile.textContent = letter;
      el.tiles.appendChild(tile);
    }
  }

  function startWord() {
    const word = R.getCurrentWord(game);
    renderWord(word);
    el.hint.textContent = theme.hint || '';
    fx.sayWord(word, { rate: 0.75 });
    if (theme.onWordStart) theme.onWordStart(word);
  }

  /* ---------- per-letter feedback ---------- */

  function handleCorrect(ev) {
    const tileEl = el.tiles.children[ev.index];
    tileEl.classList.add('done');
    fx.sayWord(ev.letter);
    if (theme.onCorrect) theme.onCorrect({ tileEl, index: ev.index, letter: ev.letter });
  }

  function handleIncorrect(ev) {
    if (theme.onIncorrect) theme.onIncorrect({ letter: ev.letter, expected: ev.expected });
  }

  function handleWordComplete(ev) {
    handleCorrect(ev);
    phase = 'celebrating';
    // a beat between the last letter and the fanfare — the pause is part of the reward
    celebrationTimers.push(setTimeout(() => {
      if (theme.onWordComplete) theme.onWordComplete(ev);
      fx.sayWord(ev.word + '!', { rate: 0.75 });
      celebrate(ev);
    }, theme.completeDelay || 700));
  }

  /* ---------- celebrations ---------- */

  function sceneFor(name) {
    const spec = theme.scenes[name];
    if (!spec) return null;
    return document.querySelector(spec.selector || '#scene-' + name);
  }

  function allScenes() {
    return Object.keys(theme.scenes).map(sceneFor).filter(Boolean);
  }

  function celebrate(ev) {
    const spec = theme.scenes[ev.celebration];
    const scene = sceneFor(ev.celebration);
    if (!spec || !scene) { endCelebration(); return; }

    el.celebrationWord.textContent = ev.word;
    el.celebrationCaption.textContent = spec.caption || '';
    el.celebration.hidden = false;
    el.celebration.classList.toggle('finale', !!ev.finale);

    // SVG elements have no .hidden property — the attribute is the only thing that works
    for (const s of allScenes()) {
      s.setAttribute('hidden', '');
      s.classList.remove('playing');
    }
    scene.removeAttribute('hidden');
    // next frame, so re-adding .playing restarts the CSS animations from the top
    requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add('playing')));

    if (spec.start) sceneCleanup = spec.start(scene, ev) || null;

    if (spec.caption) {
      celebrationTimers.push(setTimeout(() => fx.say(spec.caption, { cancel: false }), 1200));
    }
    celebrationTimers.push(setTimeout(endCelebration, spec.duration || 6500));
  }

  function endCelebration() {
    el.celebration.hidden = true;
    el.celebration.classList.remove('finale');
    for (const s of allScenes()) s.classList.remove('playing');
    if (sceneCleanup) sceneCleanup();
    sceneCleanup = null;
    clearTimers();
    phase = 'playing';
    startWord();
  }

  function clearTimers() {
    celebrationTimers.forEach(clearTimeout);
    celebrationTimers = [];
  }

  /* ---------- add-a-word modal ---------- */

  function openAddWordModal() {
    phase = 'adding-word';
    el.addWordInput.value = '';
    el.addWordError.hidden = true;
    el.addWordModal.hidden = false;
    el.addWordInput.focus();
  }

  function closeAddWordModal() {
    el.addWordModal.hidden = true;
    phase = 'playing';
  }

  function confirmAddWord() {
    const word = el.addWordInput.value.trim().toUpperCase();
    if (!word || !/^[A-Z]+$/.test(word)) {
      el.addWordError.textContent = 'Only letters please!';
      el.addWordError.hidden = false;
      return;
    }
    R.replaceCurrentWord(game, word);
    closeAddWordModal();
    startWord();
  }

  /* ---------- input ---------- */

  function begin() {
    fx.ctx(); // unlock audio inside the user gesture
    el.startOverlay.hidden = true;
    game = R.createGame({ words: theme.words, celebrations: theme.celebrations });
    phase = 'playing';
    startWord();
  }

  function onKeyDown(e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    if (phase === 'start') { begin(); return; }
    if (phase !== 'playing') return;
    // without preventDefault the same keystroke lands in the input we just focused
    if (e.key === '+') { e.preventDefault(); openAddWordModal(); return; }
    const ev = R.inputLetter(game, e.key);
    if (ev.type === 'correct') handleCorrect(ev);
    else if (ev.type === 'incorrect') handleIncorrect(ev);
    else if (ev.type === 'word-complete') handleWordComplete(ev);
  }

  /* ---------- a small helper themes use for timed steps inside a scene ---------- */

  function steps(pairs) {
    const timers = pairs.map(([ms, fn]) => setTimeout(fn, ms));
    return () => timers.forEach(clearTimeout);
  }

  function boot(themeSpec) {
    theme = themeSpec;
    el.tiles = document.getElementById('tiles');
    el.hint = document.getElementById('hint');
    el.startOverlay = document.getElementById('start-overlay');
    el.celebration = document.getElementById('celebration');
    el.celebrationWord = document.getElementById('celebration-word');
    el.celebrationCaption = document.getElementById('celebration-caption');
    const tray = document.getElementById('tray');
    if (tray) fx.useTray(tray);

    buildChrome();
    document.addEventListener('keydown', onKeyDown);
    el.startOverlay.addEventListener('click', () => { if (phase === 'start') begin(); });
    if (theme.onReady) theme.onReady();
  }

  window.SpellEngine = { boot, steps, fx, get phase() { return phase; } };
})();
</script>
<script>
/* Spellworms — theme layer: art hookups, sound design, celebration choreography.
   Shared rules and shell live in ../../engine/. */
(function () {
  'use strict';

  const E = window.SpellEngine;
  const fx = window.SpellFx;

  const plume = document.getElementById('spellworm');       // the plume <use> carries her face
  const anchor = document.querySelector('#scene .hero .plume-anchor');
  const wormMouth = document.getElementById('worm-mouth');
  const ventStack = document.getElementById('vent-stack');
  const MOODS = ['munching', 'yucking'];

  // the three sulfides a vent actually precipitates, in the colours they come out
  const MINERALS = ['mineral-pyrite', 'mineral-copper', 'mineral-barite'];
  const MINERAL_BOX = '-28 -28 56 56';

  /* ---------- sound design: glassy, watery, a long way down ---------- */

  // A bell that climbs through the word, wrapped in a little bubble of water.
  const SCALE = [329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  function plink(letterIndex) {
    const f = SCALE[Math.min(letterIndex, SCALE.length - 1)];
    fx.tone(f, 0, 0.3, 'sine', 0.2);
    fx.tone(f * 2, 0.01, 0.14, 'triangle', 0.06);
    fx.sweep(f * 0.6, f * 1.6, 0.14, 'sine', 0.05);      // the bubble
    fx.noise(0.1, 0.02, 0.035, 2600, 'bandpass');
  }

  // Wrong letter: the vent burps and goes quiet. Daft, not scary.
  function gulp() {
    fx.sweep(230, 64, 0.55, 'sine', 0.16);
    fx.noise(0.3, 0, 0.09, 260, 'lowpass');
    fx.tone(98, 0.22, 0.2, 'triangle', 0.07);
  }

  function ping() {
    fx.tone(1396.9, 0, 0.5, 'sine', 0.1);
    fx.tone(2093.0, 0.02, 0.3, 'sine', 0.05);
  }

  function clack() {
    fx.noise(0.05, 0, 0.16, 3200, 'bandpass');
    fx.tone(880, 0, 0.05, 'square', 0.05);
  }

  function flap() {
    fx.noise(0.3, 0, 0.07, 700, 'lowpass');
    fx.sweep(180, 90, 0.3, 'sine', 0.05);
  }

  function pop() {
    fx.sweep(160, 640, 0.13, 'sine', 0.18);
    fx.tone(880, 0.1, 0.12, 'triangle', 0.08);
  }

  function rumble(dur) {
    fx.noise(dur, 0, 0.11, 180, 'lowpass');
    fx.sweep(70, 130, dur, 'triangle', 0.06);
  }

  function boom() {
    fx.noise(0.9, 0, 0.26, 240, 'lowpass');
    fx.sweep(160, 40, 0.8, 'sawtooth', 0.14);
  }

  function shimmer(startIn) {
    [1046.5, 1318.5, 1567.98, 2093.0].forEach((f, i) => {
      fx.tone(f, startIn + i * 0.1, 0.3, 'sine', 0.09);
    });
  }

  function fanfare() {
    [392.0, 523.25, 659.25, 783.99].forEach((f, i) => {
      fx.tone(f, i * 0.13, 0.34, 'sine', 0.17);
      fx.tone(f * 2, i * 0.13 + 0.01, 0.16, 'triangle', 0.05);
    });
    fx.noise(0.5, 0.5, 0.05, 900, 'lowpass');           // a swell of warm water
  }

  function bigFanfare() {
    [392.0, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      fx.tone(f, i * 0.12, 0.38, 'sine', 0.17);
      fx.tone(f * 2, i * 0.12 + 0.01, 0.18, 'triangle', 0.05);
    });
    fx.tone(1567.98, 0.8, 0.8, 'sine', 0.11);
    fx.noise(0.7, 0.76, 0.07, 800, 'lowpass');
  }

  /* ---------- the vent hiccup (the wrong-letter animation) ---------- */

  let stallTimer = null;
  function stallVent() {
    clearTimeout(stallTimer);
    ventStack.classList.remove('stalled');
    // a reflow, or re-adding the class in the same frame wouldn't restart the cough
    void ventStack.getBoundingClientRect();
    ventStack.classList.add('stalled');
    stallTimer = setTimeout(() => ventStack.classList.remove('stalled'), 1000);
  }

  let duckTimer = null;
  function duckAnchor() {
    clearTimeout(duckTimer);
    anchor.classList.remove('ducking');
    void anchor.getBoundingClientRect();
    anchor.classList.add('ducking');
    duckTimer = setTimeout(() => anchor.classList.remove('ducking'), 1100);
  }

  /* ---------- celebrations ---------- */

  const scenes = {
    crab: {
      caption: 'A ghost crab scuttles over to say hello!',
      duration: 6200,
      // a claw-clack on every sideways step, then a happy little chirp
      start() {
        const beats = [];
        for (let i = 0; i < 7; i++) beats.push([420 + i * 300, clack]);
        beats.push([2700, () => { fx.tone(659.25, 0, 0.2, 'sine', 0.13); fx.tone(880, 0.14, 0.26, 'sine', 0.13); }]);
        return E.steps(beats);
      },
    },

    octopus: {
      caption: 'A dumbo octopus flaps by on its little ears!',
      duration: 6400,
      start() {
        const beats = [];
        for (let i = 0; i < 9; i++) beats.push([400 + i * 560, flap]);
        beats.push([3700, () => shimmer(0)]);
        return E.steps(beats);
      },
    },

    pompeii: {
      caption: 'The Pompeii worms pop out for a party!',
      duration: 6400,
      // one pop per worm, matching the --d delays in theme.css, over a bouncy bass
      start() {
        const beats = [[500, pop], [900, pop], [1300, pop], [1700, pop], [2100, pop]];
        for (let i = 0; i < 8; i++) {
          beats.push([700 + i * 560, () => {
            fx.tone(146.83 + (i % 3) * 49, 0, 0.16, 'triangle', 0.09);
            fx.noise(0.1, 0, 0.05, 300, 'lowpass');
          }]);
        }
        return E.steps(beats);
      },
    },

    alvin: {
      caption: 'Alvin the submarine comes down to visit!',
      duration: 6600,
      start() {
        return E.steps([
          [300, () => fx.sweep(90, 150, 2.6, 'sawtooth', 0.06)],   // thrusters, descending
          [900, ping],
          [2000, ping],
          [3400, () => { fx.tone(523.25, 0, 0.24, 'square', 0.1); fx.tone(783.99, 0.2, 0.34, 'square', 0.1); }],
          [4600, ping],
        ]);
      },
    },

    isopod: {
      caption: 'A giant isopod rolls in like a marble — and unrolls!',
      duration: 6400,
      start() {
        return E.steps([
          [320, () => rumble(2.3)],
          [2500, () => { pop(); fx.sweep(300, 900, 0.3, 'triangle', 0.14); }],
          [3400, () => shimmer(0)],
        ]);
      },
    },

    eelpout: {
      caption: 'A vent eelpout swims over for a hello!',
      duration: 6800,
      start() {
        const beats = [];
        for (let i = 0; i < 7; i++) beats.push([400 + i * 620, () => fx.noise(0.34, 0, 0.055, 520, 'lowpass')]);
        beats.push([4600, () => { fx.tone(587.33, 0, 0.22, 'sine', 0.13); fx.tone(880, 0.18, 0.3, 'sine', 0.13); }]);
        return E.steps(beats);
      },
    },

    yeticrab: {
      caption: 'A yeti crab dances with its furry arms!',
      duration: 6400,
      // a bop on every beat of the dance, matching the 0.62s arm swing
      start() {
        const beats = [];
        for (let i = 0; i < 10; i++) {
          beats.push([400 + i * 620, () => {
            fx.tone(196 + (i % 4) * 65.4, 0, 0.16, 'triangle', 0.1);
            fx.noise(0.08, 0, 0.06, 2400, 'bandpass');
          }]);
        }
        return E.steps(beats);
      },
    },

    clams: {
      caption: 'The giant clams open up and sing!',
      duration: 6400,
      // one soft note per clam, on the frame its shell gapes open
      start() {
        const notes = [392.0, 493.88, 587.33, 659.25];
        const beats = [];
        for (let round = 0; round < 3; round++) {
          [600, 1100, 1600, 2100].forEach((t, i) => {
            beats.push([t + round * 1500, () => {
              fx.tone(notes[i], 0, 0.5, 'sine', 0.13);
              fx.noise(0.2, 0, 0.05, 900, 'lowpass');
            }]);
          });
        }
        return E.steps(beats.filter(([t]) => t < 6200));
      },
    },

    nodule: {
      caption: 'Spellworm finds tasty manganese minerals!',
      duration: 8400,
      start(scene) {
        const reach = scene.querySelector('.reacher .plume');
        const cancel = E.steps([
          [900, boom],
          [1200, () => fx.sweep(120, 420, 2.2, 'sine', 0.07)],     // the nodule rising
          [3400, () => { reach.classList.add('happy'); shimmer(0); }],
          [3600, bigFanfare],
        ]);
        return () => { cancel(); reach.classList.remove('happy'); };
      },
    },
  };

  E.boot({
    name: 'Spellworms',
    hint: 'Help Spellworm spell it!',
    addWordLabel: 'Add a word for Spellworm to spell:',

    words: window.SpellWords.WORDS,
    celebrations: window.SpellWords.CELEBRATIONS,
    scenes,

    onCorrect({ tileEl, index }) {
      plink(index);
      const mineral = fx.rand(MINERALS);
      fx.flyTo({
        proto: mineral,
        size: 76,
        viewBox: MINERAL_BOX,
        fromEl: tileEl,
        toEl: wormMouth,
        spin: 280,
        onArrive() {
          fx.mood(plume, 'munching', 900, MOODS);
          fx.addToTray(mineral, MINERAL_BOX);
        },
      });
    },

    // no critter here — the vent itself stops blowing, and she ducks into her tube
    onIncorrect() {
      gulp();
      stallVent();
      duckAnchor();
      fx.mood(plume, 'yucking', 1100, MOODS);
    },

    // the finale saves its big noise for the moment she actually reaches the nodule
    onWordComplete() {
      fanfare();
    },
  });
})();
</script>
