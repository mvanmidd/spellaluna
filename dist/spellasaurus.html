<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellasaurus</title>
<style>
/*
 * Theme-free layout for the spelling-game shell: letter tiles, overlays, the add-a-word
 * modal, flying sprites, the tray and the mute button.
 *
 * Themes set the palette by overriding these custom properties, and own everything else
 * (backgrounds, art, celebration choreography).
 */

:root {
  --ink: #f3efe0;          /* body text */
  --ink-dim: rgba(243, 239, 224, 0.6);
  --accent: #ffd166;       /* highlights: done tiles, headings */
  --accent-edge: #f4a93c;
  --accent-ink: #5b3a26;   /* text on top of --accent */
  --overlay-bg: rgba(13, 19, 48, 0.96);
  --panel-bg: rgba(13, 19, 48, 0.97);
  --hairline: rgba(243, 239, 224, 0.3);
  --tile-bg: rgba(255, 255, 255, 0.08);
  --tile-ink: rgba(243, 239, 224, 0.32);   /* letter not yet typed */
  --tile-edge: rgba(243, 239, 224, 0.25);  /* its dashed outline */
  --hint-ink: var(--ink-dim);
  --chrome-ink: var(--ink);                /* the mute button, over the play area */
  --error: #ff6b6b;
  --game-font: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "Trebuchet MS", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: var(--game-font);
  color: var(--ink);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  max-width: 1100px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

/* ---------- word tiles ---------- */

#word-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;
}

#tiles {
  --n: 5;
  --gap: clamp(4px, 1vw, 16px);
  display: flex;
  justify-content: center;
  gap: var(--gap);
}

/* Tiles are as big as they can be while the whole word still fits on one line. */
.tile {
  --tile-w: min(
    clamp(30px, 10vw, 92px),
    calc((min(100vw - 32px, 1100px) - (var(--n) - 1) * var(--gap)) / var(--n))
  );
  width: var(--tile-w);
  height: calc(var(--tile-w) * 1.19);
  font-size: calc(var(--tile-w) * 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: var(--tile-ink);
  background: var(--tile-bg);
  border: 3px dashed var(--tile-edge);
  border-radius: clamp(6px, calc(var(--tile-w) * 0.18), 16px);
}

.tile.done {
  color: var(--accent-ink);
  background: var(--accent);
  border: 3px solid var(--accent-edge);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
  animation: tile-pop 0.45s ease-out;
}

@keyframes tile-pop {
  0% { transform: scale(0.6) rotate(-6deg); }
  55% { transform: scale(1.22) rotate(3deg); }
  100% { transform: scale(1) rotate(0); }
}

#hint {
  font-size: clamp(15px, 2.4vw, 21px);
  color: var(--hint-ink);
  letter-spacing: 0.06em;
  min-height: 1.4em;
  text-align: center;
}

/* ---------- collection tray ---------- */

#tray {
  position: fixed;
  left: 14px;
  bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  max-width: 280px;
  align-items: flex-end;
}
#tray svg {
  width: 42px;
  height: 42px;
  animation: tray-drop 0.4s ease-out;
}
@keyframes tray-drop {
  from { transform: translateY(-22px) scale(0.4); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

/* ---------- flying / crawling sprites ---------- */

.sprite {
  position: fixed;
  pointer-events: none;
  z-index: 40;
}
.sprite svg { display: block; }

/* ---------- mute button ---------- */

#mute {
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 60;
  font-size: 22px;
  line-height: 1;
  padding: 8px 10px;
  border-radius: 12px;
  border: 2px solid var(--chrome-hairline, var(--hairline));
  background: var(--chrome-bg, var(--tile-bg));
  color: var(--chrome-ink);
  cursor: pointer;
}

/* ---------- overlays ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: var(--overlay-bg);
  text-align: center;
  padding: 24px;
}
.overlay[hidden] { display: none; }

#start-overlay h1 {
  margin: 0;
  font-size: clamp(40px, 8.5vw, 96px);
  letter-spacing: 0.08em;
  color: var(--accent);
  text-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
}
#start-overlay .subtitle {
  margin: 0;
  font-size: clamp(16px, 2.6vw, 24px);
  color: var(--ink);
  opacity: 0.8;
}
#start-overlay .press {
  margin-top: 18px;
  font-size: clamp(18px, 3vw, 28px);
  color: var(--ink);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

/* ---------- celebration overlay ---------- */

#celebration .scene {
  width: min(92vw, 760px);
  height: auto;
}
#celebration .scene[hidden] { display: none; }

#celebration-caption {
  font-size: clamp(20px, 3.6vw, 38px);
  color: var(--accent);
  text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
  min-height: 1.4em;
}
#celebration-word {
  font-size: clamp(22px, 4.4vw, 54px);
  letter-spacing: 0.2em;
  color: var(--ink);
}

/* every celebration sprite is positioned purely via CSS transforms */
#celebration use, #celebration .cb { transform-box: view-box; }

/* ---------- add-a-word modal ---------- */

#add-word-modal { z-index: 70; }

#add-word-card {
  background: var(--panel-bg);
  border: 2px solid var(--hairline);
  border-radius: 20px;
  padding: 32px 36px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: min(480px, 90vw);
  text-align: center;
}

#add-word-card label {
  font-size: clamp(16px, 2.4vw, 22px);
  color: var(--ink);
}

#add-word-input {
  font-family: inherit;
  font-size: clamp(24px, 5vw, 44px);
  font-weight: bold;
  letter-spacing: 0.12em;
  text-align: center;
  text-transform: uppercase;
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid var(--hairline);
  background: var(--tile-bg);
  color: var(--accent);
  outline: none;
  width: 100%;
}
#add-word-input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.12);
}

#add-word-error {
  font-size: clamp(13px, 1.8vw, 16px);
  color: var(--error);
  min-height: 1.2em;
}

#add-word-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

#add-word-buttons button {
  font-family: inherit;
  font-size: clamp(15px, 2vw, 19px);
  padding: 10px 22px;
  border-radius: 12px;
  border: 2px solid var(--hairline);
  cursor: pointer;
}

#add-word-confirm {
  background: rgba(255, 209, 102, 0.18);
  color: var(--accent);
}
#add-word-confirm:hover { background: rgba(255, 209, 102, 0.3); }

#add-word-cancel {
  background: rgba(255, 255, 255, 0.06);
  color: var(--ink-dim);
}
#add-word-cancel:hover { background: rgba(255, 255, 255, 0.12); }
</style>
<style>
/* Spellasaurus — sunny prehistoric theme.
   Layout, tiles, overlays and the add-a-word modal live in ../../engine/engine.css. */

:root {
  /* overlays are deep jungle green with cream text; the play area is bright daylight */
  --ink: #f6f2e2;
  --ink-dim: rgba(246, 242, 226, 0.72);
  --accent: #ffd166;
  --accent-edge: #f2a93c;
  --accent-ink: #4a3212;
  --overlay-bg: rgba(22, 48, 28, 0.97);
  --panel-bg: rgba(22, 48, 28, 0.98);
  --hairline: rgba(246, 242, 226, 0.32);

  /* play-area chrome sits on a pale sky, so it needs dark ink */
  --tile-bg: rgba(255, 255, 255, 0.5);
  --tile-ink: rgba(46, 61, 34, 0.34);
  --tile-edge: rgba(46, 61, 34, 0.3);
  --hint-ink: rgba(42, 56, 30, 0.7);
  --chrome-ink: #2f4023;
  --chrome-bg: rgba(255, 255, 255, 0.55);
  --chrome-hairline: rgba(47, 64, 35, 0.3);

  /* how tall the landscape is — the paper below it starts exactly here */
  --scene-h: min(50vh, 42vw);

  /* Spellasaurus's colours (overridden for her mama) */
  --dino-body: #7bb37f;
  --dino-back: #5f9268;
  --dino-belly: #d7ebc6;
  --dino-shade: #5b8a63;
  --dino-foot: #46603f;
}

/* Sky behind the landscape, warm paper below it for the word tiles to sit on. */
body {
  background:
    linear-gradient(180deg, #7fc4e8 0%, #a5daee 62%, #bce4f2 100%)
      no-repeat 0 0 / 100% var(--scene-h),
    linear-gradient(180deg, #f8f1db 0%, #ecdfbb 100%)
      no-repeat 0 var(--scene-h) / 100% 100%;
}

/* ---------- main scene ---------- */

/* The landscape runs edge to edge — a ground line that stopped mid-screen looked odd.
   "slice" fills the width and crops a little sky off the top, so keep the treetops low. */
#scene {
  display: block;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  height: var(--scene-h);
}

#sun {
  filter: drop-shadow(0 0 22px rgba(255, 224, 138, 0.8));
  animation: sun-pulse 5s ease-in-out infinite alternate;
}
@keyframes sun-pulse {
  from { opacity: 0.85; }
  to   { opacity: 1; }
}

/* ---------- the dinosaur rig ----------
   Each dinosaur is three pieces in a <g class="dino">. The group's transform places
   and scales her; the pieces sit at fixed offsets in her own coordinates, so a scene
   can rotate a neck or a tail about its pivot without touching anything else. */

.dino .neck, .dino .neck-anchor { transform: translate(58px, -148px); }
.dino .tail { transform: translate(-82px, -126px); }
.dino .body, .dino .neck, .dino .tail, .dino .neck-anchor { transform-box: view-box; }

/* Face control — these custom properties cascade into the <use> shadow tree */
.dino-face {
  --eyes-open: block;
  --eyes-happy: none;
  --mouth-smile: block;
  --mouth-munch: none;
  --mouth-yuck: none;
}
.dino-face.happy {
  --eyes-open: none;
  --eyes-happy: block;
}
.dino-face.munching {
  --eyes-open: none;
  --eyes-happy: block;
  --mouth-smile: none;
  --mouth-munch: block;
}
.dino-face.yucking {
  --mouth-smile: none;
  --mouth-yuck: block;
}

/* she grazes in the treetop, and chews when a leaf arrives */
#scene .neck, #scene .neck-anchor {
  animation: graze 4.4s ease-in-out infinite alternate;
}
#scene .neck.munching { animation: chew 0.26s ease-in-out 4; }
#scene .tail { animation: tail-idle 5.2s ease-in-out infinite alternate; }

@keyframes graze {
  from { transform: translate(58px, -148px) rotate(-5deg); }
  to   { transform: translate(58px, -148px) rotate(3deg); }
}
@keyframes chew {
  0%, 100% { transform: translate(58px, -148px) rotate(0deg); }
  50%      { transform: translate(58px, -148px) rotate(5deg); }
}
@keyframes tail-idle {
  from { transform: translate(-82px, -126px) rotate(-4deg); }
  to   { transform: translate(-82px, -126px) rotate(5deg); }
}

/* ---------- start overlay art ---------- */

#start-dino {
  width: clamp(200px, 40vw, 380px);
}

/* ---------- shared celebration scenery ---------- */

#celebration .scene .ground { fill: #7fa64b; }
#celebration .dino, #celebration .trike-wrap, #celebration .stego-wrap,
#celebration text { transform-box: view-box; }

#celebration .cb-heart, #celebration .cb-star, #celebration .spark,
#celebration .drop { opacity: 0; }

@keyframes heart-float {
  0%   { opacity: 0; translate: 0 0; scale: 0.4; }
  20%  { opacity: 1; scale: 1.1; }
  100% { opacity: 0; translate: 0 -130px; scale: 1; }
}
@keyframes star-pop {
  0%   { opacity: 0; scale: 0.2; rotate: -40deg; }
  35%  { opacity: 1; scale: 1.25; rotate: 10deg; }
  70%  { opacity: 1; scale: 1; rotate: 0deg; }
  100% { opacity: 0; scale: 0.8; }
}

/* A radial burst: each sprite is placed at a shared centre (--px,--py) and thrown
   outwards along its own angle (--a) for its own distance (--d). Keeping the angle in
   a custom property means one @keyframes covers every droplet and every sparkle. */
@keyframes burst {
  0% {
    transform: translate(var(--px), var(--py)) rotate(var(--a)) translate(0, 0) scale(0.25);
    opacity: 0;
  }
  12% { opacity: 1; }
  70% { opacity: 1; }
  100% {
    transform: translate(var(--px), var(--py)) rotate(var(--a))
               translate(0, calc(-1 * var(--d))) scale(1.05);
    opacity: 0;
  }
}

/* --- happy: snuggling mommy --- */

#scene-snuggle .mama {
  transform: translate(280px, 466px) scale(0.86);
  --dino-body: #5f9b6b;
  --dino-back: #4a7d57;
  --dino-belly: #bcd9ad;
  --dino-shade: #48784f;
}
#scene-snuggle .baby { transform: translate(620px, 468px) scale(-0.48, 0.48); }

/* their necks start apart, then curl together and stay nuzzled */
#scene-snuggle.playing .mama .neck { animation: snug-mama 1.8s ease-in-out 0.4s forwards; }
#scene-snuggle.playing .baby .neck { animation: snug-baby 1.8s ease-in-out 0.4s forwards; }
#scene-snuggle.playing .baby .tail { animation: wag 0.6s ease-in-out infinite alternate; }

#scene-snuggle .mama .neck { transform: translate(58px, -148px) rotate(-8deg); }
#scene-snuggle .baby .neck { transform: translate(58px, -148px) rotate(22deg); }

@keyframes snug-mama {
  from { transform: translate(58px, -148px) rotate(-8deg); }
  to   { transform: translate(58px, -148px) rotate(40deg); }
}
@keyframes snug-baby {
  from { transform: translate(58px, -148px) rotate(22deg); }
  to   { transform: translate(58px, -148px) rotate(-30deg); }
}
@keyframes wag {
  from { transform: translate(-82px, -126px) rotate(-12deg); }
  to   { transform: translate(-82px, -126px) rotate(16deg); }
}

#scene-snuggle.playing .cb-heart { animation: heart-float 1.9s ease-out forwards; }
#scene-snuggle.playing .cb-heart.h1 { transform: translate(512px, 268px); animation-delay: 2.4s; }
#scene-snuggle.playing .cb-heart.h2 { transform: translate(600px, 262px); animation-delay: 2.75s; }
#scene-snuggle.playing .cb-heart.h3 { transform: translate(556px, 232px) scale(1.5); animation-delay: 3.1s; }
#scene-snuggle.playing .cb-heart.h4 { transform: translate(486px, 238px); animation-delay: 3.45s; }
#scene-snuggle.playing .cb-heart.h5 { transform: translate(628px, 236px); animation-delay: 3.8s; }

/* --- happy: splashing in the water --- */

#scene-splash .pond { fill: #6fc3e6; }
#scene-splash .pond-deep { fill: #4fa7d4; }
#scene-splash .foam {
  fill: #eaf8ff;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 50%;
}
#scene-splash.playing .foam { animation: foam-flash 0.9s ease-out 2.38s forwards; }
@keyframes foam-flash {
  0%   { opacity: 0; scale: 0.4 0.6; }
  18%  { opacity: 0.9; scale: 1.05 1.1; }
  100% { opacity: 0; scale: 1.3 0.8; }
}

#scene-splash .ripple {
  fill: none;
  stroke: #eaf8ff;
  stroke-width: 4;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 50%;
}

#scene-splash .swimmer { transform: translate(-150px, 470px) scale(0.58); }
#scene-splash.playing .swimmer { animation: run-and-jump 4.6s ease-in-out forwards; }
#scene-splash.playing .swimmer .neck { animation: swim-neck 4.6s ease-in-out forwards; }
#scene-splash.playing .swimmer .tail { animation: wag 0.34s ease-in-out infinite alternate; }

@keyframes run-and-jump {
  0%   { transform: translate(-150px, 470px) scale(0.58); }
  22%  { transform: translate(150px, 468px) scale(0.58); }
  38%  { transform: translate(300px, 396px) scale(0.6) rotate(-8deg); }  /* leap */
  52%  { transform: translate(428px, 476px) scale(0.62) rotate(4deg); }   /* SPLASH */
  62%  { transform: translate(438px, 452px) scale(0.62) rotate(-4deg); }
  74%  { transform: translate(452px, 480px) scale(0.62) rotate(3deg); }   /* again! */
  86%  { transform: translate(456px, 464px) scale(0.62); }
  100% { transform: translate(458px, 474px) scale(0.62); }
}
@keyframes swim-neck {
  0%   { transform: translate(58px, -148px) rotate(6deg); }
  38%  { transform: translate(58px, -148px) rotate(-22deg); }
  52%  { transform: translate(58px, -148px) rotate(10deg); }
  70%  { transform: translate(58px, -148px) rotate(-14deg); }
  100% { transform: translate(58px, -148px) rotate(-6deg); }
}

#scene-splash.playing .ripple { animation: ripple-out 1.5s ease-out forwards; }
#scene-splash.playing .ripple.r1 { animation-delay: 2.4s; }
#scene-splash.playing .ripple.r2 { animation-delay: 2.7s; }
#scene-splash.playing .ripple.r3 { animation-delay: 3.45s; }
@keyframes ripple-out {
  0%   { opacity: 0.95; scale: 0.3; }
  100% { opacity: 0; scale: 2.6; }
}

#scene-splash .drop { --px: 444px; --py: 462px; --d: 150px; }
#scene-splash.playing .drop { animation: burst 1.1s ease-out forwards; animation-delay: 2.4s; }
#scene-splash .drop.d1  { --a: -74deg; --d: 176px; }
#scene-splash .drop.d2  { --a: -50deg; --d: 148px; }
#scene-splash .drop.d3  { --a: -26deg; --d: 132px; }
#scene-splash .drop.d4  { --a:  -6deg; --d: 120px; }
#scene-splash .drop.d5  { --a:  18deg; --d: 138px; }
#scene-splash .drop.d6  { --a:  44deg; --d: 160px; }
#scene-splash .drop.d7  { --a:  66deg; --d: 180px; }
#scene-splash .drop.d8  { --a: -38deg; --d: 206px; }
/* the second, smaller splash */
#scene-splash.playing .drop.d9,
#scene-splash.playing .drop.d10 { animation-delay: 3.45s; }
#scene-splash .drop.d9  { --px: 462px; --a: -58deg; --d: 128px; }
#scene-splash .drop.d10 { --px: 462px; --a:  30deg; --d: 116px; }

/* --- happy: the tail crack --- */

#scene-tailcrack .cracker { transform: translate(430px, 470px) scale(0.78); }
#scene-tailcrack.playing .cracker .tail { animation: whip 3s ease-in-out 0.5s forwards; }
#scene-tailcrack.playing .cracker .neck { animation: proud 3s ease-in-out 0.5s forwards; }

@keyframes whip {
  0%   { transform: translate(-82px, -126px) rotate(0deg); }
  30%  { transform: translate(-82px, -126px) rotate(-26deg); }  /* wind up... */
  46%  { transform: translate(-82px, -126px) rotate(-31deg); }
  52%  { transform: translate(-82px, -126px) rotate(38deg); }   /* CRACK! */
  60%  { transform: translate(-82px, -126px) rotate(20deg); }
  72%  { transform: translate(-82px, -126px) rotate(30deg); }
  100% { transform: translate(-82px, -126px) rotate(8deg); }
}
@keyframes proud {
  0%   { transform: translate(58px, -148px) rotate(-2deg); }
  46%  { transform: translate(58px, -148px) rotate(8deg); }
  58%  { transform: translate(58px, -148px) rotate(-26deg); }
  100% { transform: translate(58px, -148px) rotate(-19deg); }
}

#scene-tailcrack .spark { --px: 205px; --py: 350px; --d: 132px; }
#scene-tailcrack.playing .spark { animation: burst 1.2s ease-out forwards; animation-delay: 2.05s; }
#scene-tailcrack .spark.k1 { --a:   0deg; }
#scene-tailcrack .spark.k2 { --a:  45deg; --d: 150px; }
#scene-tailcrack .spark.k3 { --a:  90deg; }
#scene-tailcrack .spark.k4 { --a: 135deg; --d: 116px; }
#scene-tailcrack .spark.k5 { --a: 180deg; --d: 104px; }
#scene-tailcrack .spark.k6 { --a: 225deg; --d: 150px; }
#scene-tailcrack .spark.k7 { --a: 270deg; --d: 168px; }
#scene-tailcrack .spark.k8 { --a: 315deg; }

#scene-tailcrack .crack-word {
  font-family: var(--game-font);
  font-size: 76px;
  font-weight: bold;
  fill: #ffd166;
  stroke: #7a4b12;
  stroke-width: 3;
  paint-order: stroke;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 50%;
}
#scene-tailcrack.playing .crack-word { animation: crack-pop 1.5s ease-out 2.05s forwards; }
@keyframes crack-pop {
  0%   { opacity: 0; scale: 0.3; rotate: -14deg; }
  18%  { opacity: 1; scale: 1.3; rotate: 6deg; }
  34%  { scale: 1; rotate: -3deg; }
  100% { opacity: 0; scale: 1.1; }
}

/* --- happy: playing with friends --- */

/* one hop animation for all three, steered by each one's own placement variables */
#scene-friends .trike-wrap { --hx: 152px; --hy: 470px; --sx: 0.62;  --sy: 0.62; }
#scene-friends .player     { --hx: 430px; --hy: 472px; --sx: 0.6;   --sy: 0.6; }
#scene-friends .stego-wrap { --hx: 722px; --hy: 470px; --sx: -0.6;  --sy: 0.6; }

#scene-friends .trike-wrap, #scene-friends .player, #scene-friends .stego-wrap {
  transform: translate(var(--hx), var(--hy)) scale(var(--sx), var(--sy));
}
#scene-friends.playing .trike-wrap { animation: hop 0.64s ease-in-out infinite; animation-delay: 0.1s; }
#scene-friends.playing .player     { animation: hop 0.64s ease-in-out infinite; }
#scene-friends.playing .stego-wrap { animation: hop 0.64s ease-in-out infinite; animation-delay: 0.22s; }
#scene-friends.playing .player .neck { animation: graze 0.64s ease-in-out infinite alternate; }
#scene-friends.playing .player .tail { animation: wag 0.44s ease-in-out infinite alternate; }

@keyframes hop {
  0%   { transform: translate(var(--hx), var(--hy)) scale(var(--sx), calc(var(--sy) * 0.94)); }
  38%  { transform: translate(var(--hx), calc(var(--hy) - 46px)) scale(var(--sx), var(--sy)); }
  70%  { transform: translate(var(--hx), var(--hy)) scale(var(--sx), calc(var(--sy) * 0.92)); }
  100% { transform: translate(var(--hx), var(--hy)) scale(var(--sx), calc(var(--sy) * 0.94)); }
}

#scene-friends.playing .cb-star { animation: star-pop 1.4s ease-out forwards; }
#scene-friends.playing .cb-star.s1 { transform: translate(120px, 250px); animation-delay: 1.2s; }
#scene-friends.playing .cb-star.s2 { transform: translate(680px, 236px) scale(1.3); animation-delay: 1.6s; }
#scene-friends.playing .cb-star.s3 { transform: translate(400px, 178px) scale(1.4); animation-delay: 2s; }
#scene-friends.playing .cb-star.s4 { transform: translate(250px, 190px); animation-delay: 2.4s; }
#scene-friends.playing .cb-star.s5 { transform: translate(560px, 196px) scale(1.1); animation-delay: 2.8s; }
#scene-friends.playing .cb-heart { animation: heart-float 1.9s ease-out forwards; }
#scene-friends.playing .cb-heart.h1 { transform: translate(330px, 260px); animation-delay: 3.1s; }
#scene-friends.playing .cb-heart.h2 { transform: translate(500px, 250px) scale(1.3); animation-delay: 3.5s; }

/* --- FINALE: the golden leaf at the very top --- */

#scene-goldenleaf .climber { transform: translate(300px, 482px) scale(0.86); }
#scene-goldenleaf .golden-leaf {
  transform: translate(472px, 144px) scale(1.5);
  filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.9));
  animation: leaf-beckon 1.6s ease-in-out infinite alternate;
}
@keyframes leaf-beckon {
  from { filter: drop-shadow(0 0 10px rgba(255, 209, 102, 0.6)); }
  to   { filter: drop-shadow(0 0 26px rgba(255, 233, 170, 1)); }
}

/* the long stretch: her neck climbs the tree, then holds the leaf */
#scene-goldenleaf .climber .neck { transform: translate(58px, -148px) rotate(30deg); }
#scene-goldenleaf.playing .climber .neck { animation: reach 3.4s ease-in-out 0.4s forwards; }
#scene-goldenleaf.playing .climber { animation: rear-up 3.4s ease-in-out 0.4s forwards; }
#scene-goldenleaf.playing .climber .tail { animation: brace 3.4s ease-in-out 0.4s forwards; }

@keyframes reach {
  0%   { transform: translate(58px, -148px) rotate(30deg); }
  45%  { transform: translate(58px, -148px) rotate(8deg); }
  72%  { transform: translate(58px, -148px) rotate(-2deg); }   /* nearly... */
  84%  { transform: translate(58px, -148px) rotate(-6deg); }
  100% { transform: translate(58px, -148px) rotate(-9deg); }   /* got it! */
}
@keyframes rear-up {
  0%   { transform: translate(300px, 482px) scale(0.86); }
  72%  { transform: translate(300px, 482px) scale(0.86); }
  100% { transform: translate(300px, 478px) scale(0.86); }
}
@keyframes brace {
  0%   { transform: translate(-82px, -126px) rotate(0deg); }
  100% { transform: translate(-82px, -126px) rotate(-14deg); }
}

#scene-goldenleaf .spark { --px: 472px; --py: 144px; --d: 120px; }
#scene-goldenleaf.playing .spark { animation: burst 1.5s ease-out 3.3s forwards; }
#scene-goldenleaf .spark.g1 { --a:   0deg; }
#scene-goldenleaf .spark.g2 { --a:  60deg; --d: 142px; }
#scene-goldenleaf .spark.g3 { --a: 120deg; }
#scene-goldenleaf .spark.g4 { --a: 180deg; --d: 136px; }
#scene-goldenleaf .spark.g5 { --a: 240deg; }
#scene-goldenleaf .spark.g6 { --a: 300deg; --d: 148px; }

#scene-goldenleaf.playing .cb-star { animation: star-pop 1.6s ease-out forwards; }
#scene-goldenleaf.playing .cb-star.f1 { transform: translate(140px, 150px) scale(1.2); animation-delay: 3.6s; }
#scene-goldenleaf.playing .cb-star.f2 { transform: translate(650px, 190px) scale(1.4); animation-delay: 3.9s; }
#scene-goldenleaf.playing .cb-star.f3 { transform: translate(230px, 150px); animation-delay: 4.2s; }
#scene-goldenleaf.playing .cb-star.f4 { transform: translate(580px, 140px) scale(1.3); animation-delay: 4.5s; }
#scene-goldenleaf.playing .cb-star.f5 { transform: translate(430px, 120px) scale(1.5); animation-delay: 4.8s; }
#scene-goldenleaf.playing .cb-star.f6 { transform: translate(700px, 320px) scale(1.1); animation-delay: 5.1s; }
</style>
</head>
<body>

<!-- ======= shared art (referenced everywhere via <use>) =======
     Every dinosaur is drawn in three pieces so scenes can articulate them:
       #bronto-body  — torso + legs, origin between the feet, facing right
       #bronto-neck  — neck + head, origin at the SHOULDER pivot
       #bronto-tail  — tail, origin at the HIP pivot

       neck: translate(58, -148)   tail: translate(-82, -126)

  <defs>

    <g id="bronto-tail" transform="translate(0,-2)">

    <!-- the whole dinosaur in one piece, for static art -->

    <!-- triceratops friend, feet at origin, facing right -->

</svg>

<div id="app">

  <!-- ======= main scene: Spellasaurus eating star leaves from the tree ======= -->
  <svg id="scene" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

  <!-- ======= word tiles ======= -->

<!-- ======= start overlay ======= -->

    <use href="#tree-proto" transform="translate(126, 14) scale(0.7)"/>
    <use href="#bronto-proto" class="dino-face happy"/>
  </svg>
  <h1>SPELLASAURUS</h1>
  <p class="subtitle">A spelling adventure with Spellasaurus the brontosaurus,<br>
    who eats star leaves and cracks her tail</p>

</div>

<!-- ======= celebration overlay ======= -->
<div id="celebration" class="overlay" hidden>
  <div id="celebration-word"></div>
  <div id="celebration-caption"></div>

  <!-- happy: snuggling mommy -->
  <svg id="scene-snuggle" class="scene" viewBox="0 100 800 400" hidden>
    <path class="ground" d="M 0,500 L 0,464 C 220,452 520,476 800,458 L 800,500 Z"/>
    <use href="#fern-proto" transform="translate(70, 470) scale(1.1)"/>

<script>
/*
 * Spelling-game rules — pure, no DOM, no theme.
 *
 * Every themed game (Spellaluna, Spellasaurus, ...) shares this: a shuffled word queue
 * with no immediate repeats, letter-by-letter matching, and a celebration picked after
 * each finished word.
 *
 * UMD-ish: usable as a classic <script> (window.SpellRules) and via require() in tests.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.SpellRules = api;
  }
})(typeof self !== 'undefined' ? self : this, function () {

  function shuffle(arr, rng) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  function pickFrom(list, rng) {
    return list[Math.min(Math.floor(rng() * list.length), list.length - 1)];
  }

  /*
   * createGame({ words, rng, celebrations })
   *
   * celebrations describes how the reward after each word is chosen:
   *   pool:   celebration names to draw from
   *   pick:   'cycle'  — walk the pool in order (1st word, 2nd word, ...)
   *           'random' — pick at random, never the same one twice in a row
   *   finale: { name, every } — optional; replaces the pool pick on every Nth word
   */
  function createGame(opts) {
    opts = opts || {};
    const allWords = (opts.words || []).slice();
    if (!allWords.length) throw new Error('createGame needs a non-empty words list');
    const rng = opts.rng || Math.random;
    const cel = opts.celebrations || {};
    const finale = cel.finale && cel.finale.name
      ? { name: cel.finale.name, every: cel.finale.every || 3 }
      : null;
    return {
      allWords,
      rng,
      celebrations: {
        pool: (cel.pool || []).slice(),
        pick: cel.pick === 'random' ? 'random' : 'cycle',
        finale,
      },
      queue: shuffle(allWords, rng),
      wordIndex: 0,
      letterIndex: 0,
      wordsCompleted: 0,
      poolPicks: 0,          // pool position; finales don't advance it
      lastCelebration: null,
    };
  }

  function getCurrentWord(game) {
    return game.queue[game.wordIndex];
  }

  function getLetterIndex(game) {
    return game.letterIndex;
  }

  /* Swap the word being spelled right now (the add-a-word feature). */
  function replaceCurrentWord(game, word) {
    game.queue[game.wordIndex] = word;
    game.letterIndex = 0;
    if (!game.allWords.includes(word)) game.allWords.push(word);
  }

  function advanceWord(game) {
    const lastWord = getCurrentWord(game);
    game.wordIndex++;
    game.letterIndex = 0;
    if (game.wordIndex >= game.queue.length) {
      const next = shuffle(game.allWords, game.rng);
      if (next.length > 1 && next[0] === lastWord) {
        [next[0], next[next.length - 1]] = [next[next.length - 1], next[0]];
      }
      game.queue = next;
      game.wordIndex = 0;
    }
  }

  /* Which reward plays now that `game.wordsCompleted` words are done. */
  function chooseCelebration(game) {
    const c = game.celebrations;
    const n = game.wordsCompleted;
    if (c.finale && n % c.finale.every === 0) {
      return { celebration: c.finale.name, finale: true };
    }
    if (!c.pool.length) return { celebration: null, finale: false };

    let name;
    if (c.pick === 'cycle') {
      name = c.pool[game.poolPicks % c.pool.length];
    } else {
      // never the same happy animation twice in a row — variety matters to a small human
      const choices = c.pool.length > 1
        ? c.pool.filter((x) => x !== game.lastCelebration)
        : c.pool;
      name = pickFrom(choices, game.rng);
    }
    game.poolPicks++;
    game.lastCelebration = name;
    return { celebration: name, finale: false };
  }

  /*
   * Feed one keypress into the game. Mutates `game` and returns an event:
   *   {type:'ignored'}
   *   {type:'incorrect', letter, expected}
   *   {type:'correct', letter, index}
   *   {type:'word-complete', word, letter, index, celebration, finale, wordsCompleted}
   * After 'word-complete' the game has already advanced to the next word.
   */
  function inputLetter(game, raw) {
    const letter = String(raw || '').toUpperCase();
    if (!/^[A-Z]$/.test(letter)) return { type: 'ignored' };

    const word = getCurrentWord(game);
    const expected = word[game.letterIndex];
    if (letter !== expected) {
      return { type: 'incorrect', letter, expected };
    }

    const index = game.letterIndex;
    game.letterIndex++;
    if (game.letterIndex >= word.length) {
      game.wordsCompleted++;
      const chosen = chooseCelebration(game);
      advanceWord(game);
      return {
        type: 'word-complete',
        word,
        letter,
        index,
        celebration: chosen.celebration,
        finale: chosen.finale,
        wordsCompleted: game.wordsCompleted,
      };
    }
    return { type: 'correct', letter, index };
  }

  return {
    createGame,
    getCurrentWord,
    getLetterIndex,
    replaceCurrentWord,
    inputLetter,
    shuffle,
  };
});
</script>
<script>
/*
 * Shared effects toolkit: Web Audio primitives, speech, and the sprite animations both
 * games use (a treat flying from a tile to the hero's mouth, a critter scurrying past).
 * Art is always supplied by the theme as an SVG <defs> id — this file never names one.
 *
 * Exposes window.SpellFx.
 */
(function () {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  let muted = false;
  let actx = null;
  let trayEl = null;

  /* ---------- sound ---------- */

  // Must be called from inside a user gesture the first time, or the context stays suspended.
  function ctx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, startIn, dur, type, peak) {
    const c = ctx();
    if (!c || muted) return;
    const t0 = c.currentTime + (startIn || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.18, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
    return osc;
  }

  /* A pitch slide — the raw material for bloops, rumbles and whooshes. */
  function sweep(from, to, dur, type, peak, startIn) {
    const c = ctx();
    if (!c || muted) return;
    const t0 = c.currentTime + (startIn || 0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(from, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t0 + dur * 0.85);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.2, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.07);
    return osc;
  }

  /* Filtered noise burst — splashes, thumps, tail cracks. */
  function noise(dur, startIn, peak, filterHz, filterType) {
    const c = ctx();
    if (!c || muted) return;
    const t0 = c.currentTime + (startIn || 0);
    const frames = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, frames, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const filter = c.createBiquadFilter();
    filter.type = filterType || 'bandpass';
    filter.frequency.setValueAtTime(filterHz || 1200, t0);
    const gain = c.createGain();
    gain.gain.setValueAtTime(peak || 0.18, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(gain).connect(c.destination);
    src.start(t0);
    src.stop(t0 + dur);
  }

  /* ---------- speech ---------- */

  function say(text, opts) {
    opts = opts || {};
    if (muted || !window.speechSynthesis) return;
    if (opts.cancel !== false) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 0.9;
    u.pitch = opts.pitch || 1.15;
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  /* Letters and all-caps words are read as "capital B" / acronyms — always lowercase. */
  function sayWord(word, opts) {
    say(String(word).toLowerCase(), opts);
  }

  function setMuted(next) {
    muted = next;
    if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
  }

  function isMuted() {
    return muted;
  }

  /* ---------- sprites ---------- */

  function sprite(protoId, size, viewBox) {
    const wrap = document.createElement('div');
    wrap.className = 'sprite';
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', viewBox || '-32 -32 64 64');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + protoId);
    svg.appendChild(use);
    wrap.appendChild(svg);
    document.body.appendChild(wrap);
    return wrap;
  }

  /*
   * Arc a treat from a letter tile up to the hero's mouth, then hand off to onArrive.
   * opts: { proto, size, fromEl, toEl, viewBox, duration, lift, spin, onArrive }
   */
  function flyTo(opts) {
    const size = opts.size || 84;
    const from = opts.fromEl.getBoundingClientRect();
    const to = opts.toEl.getBoundingClientRect();
    const s = sprite(opts.proto, size, opts.viewBox);
    const x0 = from.left + from.width / 2 - size / 2;
    const y0 = from.top - size / 2;
    s.style.left = x0 + 'px';
    s.style.top = y0 + 'px';
    const dx = to.left + to.width / 2 - size / 2 - x0;
    const dy = to.top + to.height / 2 - size / 2 - y0;
    const lift = opts.lift == null ? 90 : opts.lift;
    const spin = opts.spin == null ? 330 : opts.spin;

    const anim = s.animate(
      [
        { transform: 'translate(0px, 0px) scale(0.4) rotate(0deg)', opacity: 1 },
        {
          transform: `translate(${dx * 0.45}px, ${dy * 0.5 - lift}px) scale(1.1) rotate(${spin * 0.48}deg)`,
          opacity: 1,
          offset: 0.55,
        },
        { transform: `translate(${dx}px, ${dy}px) scale(0.45) rotate(${spin}deg)`, opacity: 0.9 },
      ],
      { duration: opts.duration || 800, easing: 'ease-in-out' }
    );
    anim.onfinish = () => {
      s.remove();
      if (opts.onArrive) opts.onArrive();
    };
    return s;
  }

  /* A critter wanders in under the tiles and scurries off one side. */
  function crawlPast(opts) {
    const size = opts.size || 120;
    const area = opts.areaEl.getBoundingClientRect();
    const x0 = area.left + area.width * (0.15 + Math.random() * 0.7);
    const y0 = area.bottom + (opts.drop == null ? 18 : opts.drop);
    const s = sprite(opts.proto, size, opts.viewBox);
    s.style.left = x0 + 'px';
    s.style.top = y0 + 'px';
    const dir = Math.random() < 0.5 ? -1 : 1;
    const dist = (window.innerWidth / 2 + size) * dir;
    const flip = dir < 0 ? ' scale(-1, 1)' : '';
    const wobble = opts.wobble == null ? 8 : opts.wobble;

    const anim = s.animate(
      [
        { transform: `translate(0,0) scale(0.2)${flip}`, opacity: 0 },
        { transform: `translate(${dist * 0.05}px, -6px)${flip}`, opacity: 1, offset: 0.15 },
        { transform: `translate(${dist * 0.3}px, 4px) rotate(${wobble * dir}deg)${flip}`, offset: 0.45 },
        { transform: `translate(${dist * 0.6}px, -4px) rotate(${-wobble * dir}deg)${flip}`, offset: 0.7 },
        { transform: `translate(${dist}px, 2px)${flip}`, opacity: 1 },
      ],
      { duration: opts.duration || 1700, easing: 'linear' }
    );
    anim.onfinish = () => s.remove();
    return s;
  }

  /* ---------- the collection tray (fruit eaten / leaves munched) ---------- */

  function useTray(el) {
    trayEl = el;
  }

  function addToTray(protoId, viewBox, max) {
    if (!trayEl) return;
    if (trayEl.children.length >= (max || 18)) trayEl.innerHTML = '';
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', viewBox || '-26 -30 52 56');
    const use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#' + protoId);
    svg.appendChild(use);
    trayEl.appendChild(svg);
  }

  /* ---------- mood classes (a temporary face on a <use> element) ---------- */

  const moodTimers = new Map();

  function mood(el, cls, ms, siblings) {
    if (!el) return;
    for (const other of siblings || []) el.classList.remove(other);
    if (moodTimers.has(el)) clearTimeout(moodTimers.get(el));
    if (!cls) return;
    el.classList.add(cls);
    moodTimers.set(el, setTimeout(() => el.classList.remove(cls), ms));
  }

  function rand(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  window.SpellFx = {
    ctx, tone, sweep, noise,
    say, sayWord, setMuted, isMuted,
    sprite, flyTo, crawlPast,
    useTray, addToTray,
    mood, rand,
    SVG_NS,
  };
})();
</script>
<script>
/*
 * The game shell, shared by every theme.
 *
 * Owns: the phase machine, keyboard input, letter tiles, the celebration sequencer,
 * the add-a-word modal and the mute button. Knows nothing about bats, dinosaurs,
 * fruit or leaves — a theme supplies words, art, sounds and celebration scenes, and
 * calls SpellEngine.boot(theme) once its <script> has loaded.
 *
 * The theme's page must provide: #tiles, #hint, #start-overlay, #celebration,
 * #celebration-word, #celebration-caption, one #scene-<name> per celebration, and
 * optionally #tray. Everything else on the page is the theme's own art.
 */
(function () {
  'use strict';

  const R = window.SpellRules;
  const fx = window.SpellFx;

  let theme = null;
  let game = null;
  let phase = 'start'; // 'start' | 'playing' | 'celebrating' | 'adding-word'
  let sceneCleanup = null;
  let celebrationTimers = [];
  const el = {};

  /* ---------- chrome the engine owns outright ---------- */

  function buildChrome() {
    const mute = document.createElement('button');
    mute.id = 'mute';
    mute.setAttribute('aria-label', 'Toggle sound');
    mute.textContent = '🔊';
    mute.addEventListener('click', () => {
      fx.setMuted(!fx.isMuted());
      mute.textContent = fx.isMuted() ? '🔇' : '🔊';
    });
    document.body.appendChild(mute);

    const modal = document.createElement('div');
    modal.id = 'add-word-modal';
    modal.className = 'overlay';
    modal.hidden = true;
    modal.innerHTML = `
      <div id="add-word-card">
        <label for="add-word-input"></label>
        <input id="add-word-input" type="text" maxlength="20"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
        <div id="add-word-error" hidden></div>
        <div id="add-word-buttons">
          <button id="add-word-confirm">Add word</button>
          <button id="add-word-cancel">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(modal);

    el.addWordModal = modal;
    el.addWordLabel = modal.querySelector('label');
    el.addWordInput = modal.querySelector('#add-word-input');
    el.addWordError = modal.querySelector('#add-word-error');
    el.addWordLabel.textContent =
      theme.addWordLabel || `Add a word for ${theme.name || 'the game'} to spell:`;

    modal.querySelector('#add-word-confirm').addEventListener('click', confirmAddWord);
    modal.querySelector('#add-word-cancel').addEventListener('click', closeAddWordModal);
    el.addWordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  { e.preventDefault(); confirmAddWord(); }
      if (e.key === 'Escape') { e.preventDefault(); closeAddWordModal(); }
    });
  }

  /* ---------- words and tiles ---------- */

  function renderWord(word) {
    el.tiles.innerHTML = '';
    // tiles shrink to fit long words (TYRANNOSAURUS is 13 of them)
    el.tiles.style.setProperty('--n', word.length);
    for (const letter of word) {
      const tile = document.createElement('span');
      tile.className = 'tile';
      tile.textContent = letter;
      el.tiles.appendChild(tile);
    }
  }

  function startWord() {
    const word = R.getCurrentWord(game);
    renderWord(word);
    el.hint.textContent = theme.hint || '';
    fx.sayWord(word, { rate: 0.75 });
    if (theme.onWordStart) theme.onWordStart(word);
  }

  /* ---------- per-letter feedback ---------- */

  function handleCorrect(ev) {
    const tileEl = el.tiles.children[ev.index];
    tileEl.classList.add('done');
    fx.sayWord(ev.letter);
    if (theme.onCorrect) theme.onCorrect({ tileEl, index: ev.index, letter: ev.letter });
  }

  function handleIncorrect(ev) {
    if (theme.onIncorrect) theme.onIncorrect({ letter: ev.letter, expected: ev.expected });
  }

  function handleWordComplete(ev) {
    handleCorrect(ev);
    phase = 'celebrating';
    // a beat between the last letter and the fanfare — the pause is part of the reward
    celebrationTimers.push(setTimeout(() => {
      if (theme.onWordComplete) theme.onWordComplete(ev);
      fx.sayWord(ev.word + '!', { rate: 0.75 });
      celebrate(ev);
    }, theme.completeDelay || 700));
  }

  /* ---------- celebrations ---------- */

  function sceneFor(name) {
    const spec = theme.scenes[name];
    if (!spec) return null;
    return document.querySelector(spec.selector || '#scene-' + name);
  }

  function allScenes() {
    return Object.keys(theme.scenes).map(sceneFor).filter(Boolean);
  }

  function celebrate(ev) {
    const spec = theme.scenes[ev.celebration];
    const scene = sceneFor(ev.celebration);
    if (!spec || !scene) { endCelebration(); return; }

    el.celebrationWord.textContent = ev.word;
    el.celebrationCaption.textContent = spec.caption || '';
    el.celebration.hidden = false;
    el.celebration.classList.toggle('finale', !!ev.finale);

    // SVG elements have no .hidden property — the attribute is the only thing that works
    for (const s of allScenes()) {
      s.setAttribute('hidden', '');
      s.classList.remove('playing');
    }
    scene.removeAttribute('hidden');
    // next frame, so re-adding .playing restarts the CSS animations from the top
    requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add('playing')));

    if (spec.start) sceneCleanup = spec.start(scene, ev) || null;

    if (spec.caption) {
      celebrationTimers.push(setTimeout(() => fx.say(spec.caption, { cancel: false }), 1200));
    }
    celebrationTimers.push(setTimeout(endCelebration, spec.duration || 6500));
  }

  function endCelebration() {
    el.celebration.hidden = true;
    el.celebration.classList.remove('finale');
    for (const s of allScenes()) s.classList.remove('playing');
    if (sceneCleanup) sceneCleanup();
    sceneCleanup = null;
    clearTimers();
    phase = 'playing';
    startWord();
  }

  function clearTimers() {
    celebrationTimers.forEach(clearTimeout);
    celebrationTimers = [];
  }

  /* ---------- add-a-word modal ---------- */

  function openAddWordModal() {
    phase = 'adding-word';
    el.addWordInput.value = '';
    el.addWordError.hidden = true;
    el.addWordModal.hidden = false;
    el.addWordInput.focus();
  }

  function closeAddWordModal() {
    el.addWordModal.hidden = true;
    phase = 'playing';
  }

  function confirmAddWord() {
    const word = el.addWordInput.value.trim().toUpperCase();
    if (!word || !/^[A-Z]+$/.test(word)) {
      el.addWordError.textContent = 'Only letters please!';
      el.addWordError.hidden = false;
      return;
    }
    R.replaceCurrentWord(game, word);
    closeAddWordModal();
    startWord();
  }

  /* ---------- input ---------- */

  function begin() {
    fx.ctx(); // unlock audio inside the user gesture
    el.startOverlay.hidden = true;
    game = R.createGame({ words: theme.words, celebrations: theme.celebrations });
    phase = 'playing';
    startWord();
  }

  function onKeyDown(e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    if (phase === 'start') { begin(); return; }
    if (phase !== 'playing') return;
    // without preventDefault the same keystroke lands in the input we just focused
    if (e.key === '+') { e.preventDefault(); openAddWordModal(); return; }
    const ev = R.inputLetter(game, e.key);
    if (ev.type === 'correct') handleCorrect(ev);
    else if (ev.type === 'incorrect') handleIncorrect(ev);
    else if (ev.type === 'word-complete') handleWordComplete(ev);
  }

  /* ---------- a small helper themes use for timed steps inside a scene ---------- */

  function steps(pairs) {
    const timers = pairs.map(([ms, fn]) => setTimeout(fn, ms));
    return () => timers.forEach(clearTimeout);
  }

  function boot(themeSpec) {
    theme = themeSpec;
    el.tiles = document.getElementById('tiles');
    el.hint = document.getElementById('hint');
    el.startOverlay = document.getElementById('start-overlay');
    el.celebration = document.getElementById('celebration');
    el.celebrationWord = document.getElementById('celebration-word');
    el.celebrationCaption = document.getElementById('celebration-caption');
    const tray = document.getElementById('tray');
    if (tray) fx.useTray(tray);

    buildChrome();
    document.addEventListener('keydown', onKeyDown);
    el.startOverlay.addEventListener('click', () => { if (phase === 'start') begin(); });
    if (theme.onReady) theme.onReady();
  }

  window.SpellEngine = { boot, steps, fx, get phase() { return phase; } };
})();
</script>
<script>
/* Spellasaurus — theme layer: art hookups, sound design, celebration choreography.
   Shared rules and shell live in ../../engine/. */
(function () {
  'use strict';

  const E = window.SpellEngine;
  const fx = window.SpellFx;

  const bronto = document.getElementById('bronto');       // the neck <use> carries her face
  const brontoMouth = document.getElementById('bronto-mouth');
  const tiles = document.getElementById('tiles');
  const MOODS = ['munching', 'yucking'];

  /* ---------- sound design: woody, leafy, and a bit rumbly ---------- */

  // A warm marimba-ish plink that climbs through the word, plus a leaf rustle.
  const SCALE = [392.0, 440.0, 523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
  function plink(letterIndex) {
    const f = SCALE[Math.min(letterIndex, SCALE.length - 1)];
    fx.tone(f, 0, 0.26, 'triangle', 0.2);
    fx.tone(f * 3, 0, 0.09, 'sine', 0.05);
    fx.noise(0.12, 0.01, 0.05, 5200, 'highpass'); // leaves rustling
  }

  // A friendly little grumble — silly, never scary.
  function grumble() {
    fx.sweep(190, 78, 0.5, 'sawtooth', 0.14);
    fx.noise(0.22, 0, 0.08, 320, 'lowpass');
    fx.tone(240, 0.16, 0.12, 'square', 0.05);
  }

  function fanfare() {
    [392.0, 493.88, 587.33, 783.99].forEach((f, i) => {
      fx.tone(f, i * 0.14, 0.32, 'triangle', 0.18);
    });
    fx.sweep(300, 150, 0.6, 'sawtooth', 0.1, 0.56);   // a happy little roar
    fx.noise(0.4, 0.56, 0.06, 700, 'lowpass');
  }

  function bigFanfare() {
    [392.0, 493.88, 587.33, 783.99, 987.77, 1174.7].forEach((f, i) => {
      fx.tone(f, i * 0.12, 0.34, 'triangle', 0.18);
    });
    fx.tone(1567.98, 0.78, 0.7, 'sine', 0.12);
    fx.sweep(260, 120, 0.9, 'sawtooth', 0.12, 0.8);
    fx.noise(0.5, 0.8, 0.07, 620, 'lowpass');
  }

  function splash() {
    fx.noise(0.5, 0, 0.26, 1400, 'bandpass');
    fx.sweep(900, 260, 0.35, 'sine', 0.1);
  }

  function crack() {
    fx.noise(0.09, 0, 0.3, 2600, 'bandpass');
    fx.sweep(1600, 300, 0.16, 'square', 0.14);
    [1046.5, 1318.5, 1567.98].forEach((f, i) => fx.tone(f, 0.1 + i * 0.07, 0.2, 'sine', 0.09));
  }

  function sparkleRun(startIn) {
    [1046.5, 1318.5, 1567.98, 2093.0].forEach((f, i) => {
      fx.tone(f, startIn + i * 0.1, 0.26, 'sine', 0.09);
    });
  }

  /* ---------- celebrations ---------- */

  const scenes = {
    snuggle: {
      caption: 'Spellasaurus snuggles her mommy!',
      duration: 6000,
    },

    splash: {
      caption: 'Spellasaurus splashes in the water!',
      duration: 6200,
      // the sound has to land on the frame she hits the water
      start() {
        return E.steps([[2400, splash], [3450, splash]]);
      },
    },

    tailcrack: {
      caption: 'Spellasaurus cracks her tail — CRACK!',
      duration: 6400,
      start() {
        return E.steps([[2050, crack], [2200, () => sparkleRun(0)]]);
      },
    },

    friends: {
      caption: 'Spellasaurus plays with her friends!',
      duration: 6200,
      // a bouncy little thump under every hop
      start() {
        const beats = [];
        for (let i = 0; i < 7; i++) {
          beats.push([700 + i * 620, () => {
            fx.noise(0.14, 0, 0.1, 260, 'lowpass');
            fx.tone(196 + (i % 3) * 65, 0, 0.14, 'triangle', 0.08);
          }]);
        }
        return E.steps(beats);
      },
    },

    goldenleaf: {
      caption: 'Spellasaurus reaches the golden leaf at the very top!',
      duration: 8200,
      start(scene) {
        const neck = scene.querySelector('.neck');
        const cancel = E.steps([
          // she stretches... and stretches... and gets it
          [900, () => fx.sweep(180, 300, 1.6, 'sawtooth', 0.07)],
          [3300, () => { neck.classList.add('happy'); sparkleRun(0); }],
          [3500, bigFanfare],
        ]);
        return () => { cancel(); neck.classList.remove('happy'); };
      },
    },
  };

  E.boot({
    name: 'Spellasaurus',
    hint: 'Help Spellasaurus spell it!',
    addWordLabel: 'Add a word for Spellasaurus to spell:',

    words: window.SpellWords.WORDS,
    celebrations: window.SpellWords.CELEBRATIONS,
    scenes,

    onCorrect({ tileEl, index }) {
      plink(index);
      fx.flyTo({
        proto: 'leaf-star',
        size: 76,
        fromEl: tileEl,
        toEl: brontoMouth,
        spin: 300,
        onArrive() {
          fx.mood(bronto, 'munching', 800, MOODS);
          fx.addToTray('leaf-star', '-26 -26 52 56');
        },
      });
    },

    onIncorrect() {
      grumble();
      fx.mood(bronto, 'yucking', 1100, MOODS);
      fx.crawlPast({
        proto: 'bug-dragonfly',
        size: 130,
        areaEl: tiles,
        drop: -26,
        wobble: 14,
        duration: 1500,
      });
    },

    // the finale saves its big noise for the moment she actually reaches the leaf
    onWordComplete() {
      fanfare();
    },
  });
})();
</script>
</body>
