<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling games</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", "Trebuchet MS", sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #33456f 0%, #1a2456 45%, #0d1330 100%);
    color: #f3efe0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 24px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: 0.06em;
    color: #ffd166;
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
  .games {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
  }
  a.game {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: min(38vw, 320px);
    min-width: 240px;
    padding: 28px 24px 24px;
    border-radius: 26px;
    border: 3px solid rgba(243, 239, 224, 0.28);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.game:hover, a.game:focus {
    transform: translateY(-6px) scale(1.03);
    border-color: #ffd166;
    outline: none;
  }
  a.game .art { font-size: clamp(56px, 10vw, 92px); line-height: 1.1; }
  a.game .name { font-size: clamp(22px, 3.4vw, 34px); font-weight: bold; letter-spacing: 0.05em; }
  a.game .blurb { font-size: clamp(13px, 1.8vw, 17px); opacity: 0.75; text-align: center; }
  .luna { background: linear-gradient(180deg, rgba(90, 70, 160, 0.4), rgba(20, 26, 66, 0.6)); }
  .saurus { background: linear-gradient(180deg, rgba(90, 160, 110, 0.4), rgba(22, 60, 40, 0.6)); }
  .foot { font-size: 14px; opacity: 0.5; }
</style>
</head>
<body>
  <h1>Pick a spelling game</h1>
  <div class="games">
    <a class="game luna" href="themes/spellaluna/index.html">
      <span class="art">🦇🥭</span>
      <span class="name">Spellaluna</span>
      <span class="blurb">A fruit bat, her bird friends, and a lot of mangos</span>
    </a>
    <a class="game saurus" href="themes/spellasaurus/index.html">
      <span class="art">🦕🌿</span>
      <span class="name">Spellasaurus</span>
      <span class="blurb">A brontosaurus, star leaves, and a golden leaf at the top</span>
    </a>
  </div>
  <div class="foot">Type the word you see. Press + to add a word of your own.</div>
</body>
</html>
